<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>翱三通史</title><link rel="stylesheet" href="./../static/css/common.css"><style>.hint{color:#fff}body::before{content:'翱三通史·学生传记';position:fixed;bottom:12px;right:20px;font-size:.9rem;color:#67553d;background:#efe6d4c0;padding:.3rem 1rem;border-radius:30px;border:1px solid #bba27a;backdrop-filter:blur(2px);box-shadow:0 2px 6px #221e14;font-family:'Courier New','宋体',monospace;letter-spacing:2px;z-index:10}#psg{grid-template-columns:repeat(3,1fr)}</style><script>window.addEventListener("message",e=>{["https://www.cjchcoderchat.site:3"].includes(e.origin)&&e.data&&"AUTH_STATE"===e.data.type&&e.data.isLoggedIn&&(sessionStorage.setItem("user",e.data.user),sessionStorage.setItem("isTeacher",e.data.isTeacher.toString()),sessionStorage.setItem("userID",e.data.userId))})</script></head><body><h1>翱三通史·学生传记</h1><div class="hint">【注意】本人可以编辑自己的传记！（提交秘钥：admin?pwd=123456）</div><div id="psg"></div><a href="/author" class="signature-container signature-link">✻ 甲辰校勘 ✻</a> <button class="signature-container signature-btn" onclick="logout()">✻ 退出登录 ✻</button><script>const user=sessionStorage.getItem("user");user||(window.location.href="/login");const isTeacher=sessionStorage.getItem("isTeacher");function logout(){sessionStorage.clear(),location.reload()}function getArticle(e){const t={author:e,type:"students"};fetch("/api/get-articles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)}).then(e=>e.json()).then(e=>{if(console.log(e),!e||!e.data||0===e.data.length){return void(document.querySelector("#psg").innerHTML="<p>📜 没有文章</p>")}showArticle(e.data)}).catch(e=>{console.log(e),document.querySelector("#psg").innerHTML="<p>❌ 载入失败，请稍后重试</p>"})}function showArticle(e){const t=document.querySelector("#psg");if(!Array.isArray(e)||0===e.length)return;let o="";e.forEach(e=>{o+=`<a href="/student/${encodeURIComponent(e[1])}">${escapeHtml(e[0])||"无题"}</a>`}),t.innerHTML+=o;document.querySelectorAll("#psg a").forEach(e=>{e.addEventListener("click",t=>{t.preventDefault();window.open(e.href).postMessage({type:"AUTH_STATE",isLoggedIn:!0,user:sessionStorage.getItem("user"),isTeacher:"true"===sessionStorage.getItem("isTeacher"),userId:sessionStorage.getItem("userID")},"https://www.cjchcoderchat.site:3/")})})}function escapeHtml(e){return e?e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"):e}document.addEventListener("DOMContentLoaded",()=>{getArticle(".*")})</script></body></html>
