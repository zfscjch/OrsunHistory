rage.getItem("userID")},"https://www.cjchcoderchat.site:3")})})}function escapeHtml(e){return e?e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"):e}user||(window.location.href="/login"),document.addEventListener("DOMContentLoaded",()=>{getArticle(".*")})</script></body></html>
