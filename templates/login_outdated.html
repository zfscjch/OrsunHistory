icy"></div><button class="close-dialog" disabled="disabled"><span id="disabled-hint"><span id="disabled-time">5</span>s后可以点击&nbsp;&nbsp;</span> 我已知晓《翱三通史官网用户信息保密协议》</button></dialog></div><div class="allow-policy"><dialog id="allow"><div>登录即代表用户知晓并同意<span class="show-policy">《翱三通史官网用户信息保密协议》</span></div><button id="continue" class="login-btn" disabled="disabled">登录</button></dialog></div><div id="loginFormContainer"><form id="loginForm"><div class="form-group"><input type="text" id="username" placeholder="用户名(请填写真实姓名)" required></div><div class="form-group"><input type="password" id="password" placeholder="密码(请输入学号,如果您是老师,请输入111111)" required></div><div class="check-area"><input type="checkbox" id="autoLogin"> <label for="autoLogin">自动登录</label></div><div class="check-area"><input type="checkbox" id="know-policy"> <label for="know-policy">已知晓</label><span id="show-p" class="show-policy">《翱三通史官网用户信息保密协议》</span></div><button type="submit" class="login-btn">登录</button><div id="message" class="error-message"></div><div class="info-text">请注意：用户名为真实姓名，密码为学号。如果您是老师，请输入：真实姓名+111111； 如果您是本班的非中考学科教师或非本班教师，请输入：test+111111</div><a href="/login" class="issue">返回现代版</a><br><a href="/issues" class="issue">无法登录？向翱三通史安全应急响应中心反映问题</a></form></div></div><script>const AUTO_LOGIN_KEY="Orsun_Auto_Login",USER_DATA_KEY="Orsun_User_Data";async function checkAutoLogin(){try{if(console.log("checking..."),sessionStorage.getItem("fromIndex"))return;const e=localStorage.getItem(AUTO_LOGIN_KEY);if(!e)return;const o=JSON.parse(e);if(console.log(o),!o.enabled||!o.username||!o.password)return;if(o.expireTime&&(new Date).getTime()>o.expireTime)return void clearAutoLogin();if(!confirm("上次登录的用户"+o.username+"开启了自动登录，请问是否继续自动登录？"))return;document.querySelector("#autoLoginLoading").style.display="flex",document.querySelector("#loginFormContainer").style.display="none",await attemptAutoLogin(o.username,o.password)}catch(e){console.error("自动登录检查失败:",e),document.querySelector("#autoLoginLoading").style.displ
