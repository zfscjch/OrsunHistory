<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>翱三通史 - 安全应急响应中心</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./../static/css/common.css">
    <style>
        /* ===== 字体统一：西文衬线优先，中文按平台回退到优质宋体 ===== */
        :root {
            --font-serif: Georgia, "Songti SC", "STSong", "SimSun",
            "Noto Serif CJK SC", "Source Han Serif SC", serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI",
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
            "Noto Sans CJK SC", sans-serif;
        }

        /* 覆盖 common.css 的 body 字体，统一为衬线 */
        body {
            font-family: var(--font-serif);
        }

        /* ===== issue.html 特有样式 ===== */
        .container {
            background: #f7efe0 linear-gradient(145deg, #f3ead9 0%, #faf3e2 70%);
            border: 1px solid #bbaa8a;
            border-radius: 32px 32px 24px 24px;
            box-shadow:
                    0 20px 30px -10px rgba(0,0,0,0.7),
                    inset 0 0 0 1px #fff6e5,
                    inset 2px 2px 8px rgba(255, 245, 215, 0.8);
            padding: 3rem 4rem;
            margin: 1.5rem 0;
            max-width: 700px;
            width: 100%;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px solid rgba(140, 110, 70, 0.2);
            border-radius: 36px 36px 28px 28px;
            pointer-events: none;
            box-shadow: inset 0 0 20px #bba27a40;
        }

        /* ===== 表单 ===== */
        #issueForm {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        #issueForm label {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            font-weight: 500;
            color: #3c2e1f;
            letter-spacing: 0.04em;      /* 原来是 1px，收紧 */
            line-height: 1.6;
            text-shadow: 1px 1px 0 #fff3e0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #issueForm label::before {
            content: '❦';
            color: #a57c54;
            font-size: 1.2rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        #username {
            display: none;
        }

        #issueForm textarea {
            font-family: var(--font-serif);
            font-size: 1.05rem;          /* 原 1rem，中文衬线小字号偏细 */
            line-height: 1.8;            /* 原 1.6，中文行距更舒展 */
            letter-spacing: 0.02em;
            background: #fcf8f0;
            border: 2px solid #cbb291;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            color: #2b2217;
            resize: vertical;
            min-height: 140px;
            transition: all 0.3s ease;
            box-shadow: inset 2px 2px 8px rgba(120, 90, 50, 0.1);
        }

        #issueForm textarea:focus {
            outline: none;
            border-color: #8f7b5f;
            box-shadow: inset 2px 2px 8px rgba(120, 90, 50, 0.15),
            0 0 0 4px rgba(200, 180, 140, 0.2);
            background: #fffcf5;
        }

        #issueForm textarea::placeholder {
            color: #9a8464;              /* 原 #b09a7a，对比度太低 */
            font-style: italic;
            opacity: 0.85;
        }

        /* ===== 提交按钮 ===== */
        #submitIssue {
            font-family: var(--font-serif);
            display: inline-block;
            font-size: 1.25rem;
            font-weight: 500;
            color: #3c2e1f;
            letter-spacing: 0.12em;      /* 原 2px，改为相对单位 */
            text-decoration: none;
            padding: 0.8rem 2.2rem;
            background: linear-gradient(145deg, #dac9ae, #efdfc7);
            border: 1px solid #b5956b;
            border-radius: 60px;
            box-shadow:
                    0 8px 0 #7a623e,
                    0 12px 18px -8px #1f1a0e,
                    inset 0 -2px 4px #fff4dd,
                    inset 0 2px 4px #fffff0;
            transition: all 0.15s ease-in-out;
            position: relative;
            text-shadow: 1px 1px 0 #fff3e0;
            cursor: pointer;
            margin-top: 0.5rem;
            width: 100%;
        }

        #submitIssue::before {
            content: '❦';
            font-size: 1.2rem;
            color: #a57c54;
            opacity: 0.7;
            margin-right: 10px;
        }

        #submitIssue::after {
            content: '❦';
            font-size: 1.2rem;
            color: #a57c54;
            opacity: 0.7;
            margin-left: 10px;
        }

        #submitIssue:hover {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7a623e, 0 16px 24px -10px #0a0804,
            inset 0 -1px 3px #fff1d6, inset 0 1px 5px #fffff0;
            background: linear-gradient(145deg, #d2bea0, #ebdac2);
            color: #241b10;
            border-color: #b07d4c;
        }

        #submitIssue:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #7a623e, 0 18px 20px -12px #0f0b06,
            inset 0 -2px 4px #cfb894;
        }

        /* ===== 响应消息 ===== */
        #responseMessage {
            font-family: var(--font-serif);
            margin-top: 1.5rem;
            padding: 0.5rem 0;
            font-size: 1rem;
            line-height: 1.7;
            text-align: center;
            min-height: 2.5rem;
        }

        #responseMessage p {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 240, 0.5);
            border: 1px dashed #cbb291;
        }

        #responseMessage p[style*="color:green"] {
            border-color: #7a9a6a;
            background: rgba(120, 160, 100, 0.1);
        }

        #responseMessage p[style*="color:red"] {
            border-color: #b07060;
            background: rgba(180, 90, 70, 0.08);
        }

        /* ===== 页脚 ===== */
        .footer {
            font-family: var(--font-serif);
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #8f7b5f;
            text-align: center;
            letter-spacing: 0.02em;
            border-top: 1px dashed #cbb291;
            padding-top: 1.5rem;
            width: 100%;
            max-width: 700px;
        }

        .footer a {
            color: #7a623e;
            text-decoration: none;
            border-bottom: 1px dotted #b5956b;
            transition: all 0.2s ease;
        }

        .footer a:hover {
            color: #3c2e1f;
            border-bottom-color: #3c2e1f;
        }

        /* ===== 右侧签名条 ===== */
        .signature-right {
            position: fixed;
            right: 0;
            top: 40%;
            background: #493e2d;
            color: #dacbbc;
            padding: 0.8rem 0.2rem;
            writing-mode: vertical-rl;
            font-family: var(--font-serif);
            font-size: 0.85rem;          /* 原 0.8rem，略放大 */
            border-radius: 12px 0 0 12px;
            letter-spacing: 0.4em;       /* 原 6px，改为相对单位 */
            line-height: 1.5;
            border: 1px solid #ad9b7c;
            border-right: none;
            box-shadow: -2px 4px 12px #0f0d09;
            text-shadow: 0 0 2px #dec393;
            z-index: 10;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: default;
            pointer-events: none;
        }

        .signature-right:hover {
            background: #5f4f39;
            color: #f0e2ce;
            border-color: #dbbc93;
            box-shadow: -4px 6px 16px #221e14;
            letter-spacing: 0.55em;
        }

        /* ===== 顶部导航标签 ===== */
        .nav-tag {
            position: fixed;
            top: 12px;
            left: 20px;
            font-family: var(--font-ui);   /* 原 Courier+宋体，小标签用无衬线更清晰 */
            font-size: 0.85rem;
            font-weight: 500;
            color: #67553d;
            background: #efe6d4c0;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid #bba27a;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 6px #221e14;
            letter-spacing: 0.05em;
            z-index: 10;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-tag:hover {
            background: #dacbbc;
            color: #2b2217;
            border-color: #8f7b5f;
        }

        .nav-tag::before {
            content: '← ';
            opacity: 0.7;
        }

        /* ===== 标题 ===== */
        /* ===== 标题优化 ===== */
        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            color: #3c2e1f; /* 加深颜色，提高对比度 */
            letter-spacing: 0.08em; /* 略微收紧字间距，避免过于松散 */
            margin-bottom: 2.5rem;

            /* 彻底清除可能导致模糊的硬阴影，改为非常微弱的柔光，增加质感 */
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.6), 0 1px 1px rgba(140, 110, 70, 0.2);
        }
        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: 0.05em;
                /* 之前代码里这里是硬阴影，现在改为清晰的无阴影或轻阴影 */
                text-shadow: none;
            }

            .container {
                padding: 2rem 1.5rem;
                margin: 1rem 0.5rem;
            }
            #issueForm label {
                font-size: 1.05rem;
            }
            #submitIssue {
                font-size: 1.1rem;
                padding: 0.6rem 1.5rem;
            }
            #submitIssue::before,
            #submitIssue::after {
                font-size: 1rem;
            }
            .signature-right {
                font-size: 0.75rem;
                padding: 0.6rem 0.15rem;
                letter-spacing: 0.35em;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem 0.5rem;
            }
            .container {
                padding: 1.5rem 1rem;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.5rem;
                letter-spacing: 0.03em;
            }
            #issueForm textarea {
                min-height: 110px;
                font-size: 1rem;
                padding: 0.8rem;
                line-height: 1.75;
            }
            #submitIssue {
                font-size: 1rem;
                padding: 0.5rem 1rem;
                letter-spacing: 0.08em;
            }
            #submitIssue::before,
            #submitIssue::after {
                display: none;
            }
            .signature-right {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- 返回主页的导航标签 -->
<a href="/" class="nav-tag">返 回 史 册</a>

<!-- 仿古签条（右侧装饰） -->
<div class="signature-container">✻ 安 全 应 急 ✻</div>

<!-- 主容器 -->
<div class="container">
    <h1>安 全 应 急 响 应 中 心</h1>

    <form id="issueForm">
        <input id="username" required>
        <label for="issue">你遇到了什么问题？我们将全力帮您解决！</label>
        <textarea placeholder="请在此处详细描述您遇到的问题……" id="issue"></textarea>
        <button type="submit" id="submitIssue">提 交 问 题</button>
    </form>

    <div id="responseMessage"></div>
</div>

<!-- 页脚 -->
<div class="footer">
    &copy; 2025-2026
    <a href="https://github.com/zfscjch/OrsunHistory" target="_blank">Orsun History</a>.
    All Rights Reserved.
</div>

<script>
    async function init() {
        const res = await fetch('/api/currentUser');
        const json = await res.text();
        const username = JSON.parse(json).user;
        const userNameEl = document.querySelector("#username");
        if (!username) {
            userNameEl.style.display = "block";
            userNameEl.placeholder = "请先登录（用户名）";
            userNameEl.style.display = "block";
            userNameEl.style.background = "#fcf8f0";
            userNameEl.style.border = "2px solid #cbb291";
            userNameEl.style.borderRadius = "12px";
            userNameEl.style.padding = "0.8rem 1.2rem";
            userNameEl.style.fontFamily = "'Georgia', 'Times New Roman', '宋体', serif";
            userNameEl.style.fontSize = "1rem";
            userNameEl.style.color = "#2b2217";
            userNameEl.style.marginBottom = "0.5rem";
        } else {
            userNameEl.value = username;
            userNameEl.type = "hidden";
        }
    }

    document.getElementById('issueForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const issueText = document.getElementById('issue').value;
        const messageDiv = document.getElementById('responseMessage');

        if (!issueText.trim()) {
            messageDiv.innerHTML = '<p style="color:#b07060;">⚠ 请 输 入 问 题 内 容</p>';
            return;
        }

        const formData = new FormData();
        const username = sessionStorage.getItem("user") || document.querySelector("#username").value;
        formData.append('issue', issueText);
        formData.append('username', username);

        fetch('/api/issues', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => Promise.reject(err));
                }
                return response.json();
            })
            .then(data => {
                if (data.status === "success") {
                    messageDiv.innerHTML = `<p style="color:#5a7a4a;">✅ ${data.msg}</p>`;
                    document.getElementById('issue').value = '';
                } else {
                    messageDiv.innerHTML = `<p style="color:#b07060;">❌ ${data.error || '提交失败'}</p>`;
                }
            })
            .catch(error => {
                messageDiv.innerHTML = `<p style="color:#b07060;">❌ 提交失败: ${error.error || '网络错误'}</p>`;
            });
    });

    init();
</script>
</body>
</html>
