<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翱三通史 · 管理员界面</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f6f4f0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px;margin:0;line-height:1.5;color:#1f1b17}.admin-container{max-width:700px;width:100%;background:#fff;padding:2.8rem 2.5rem 2.2rem;border-radius:28px;border:1px solid #edeae5;box-shadow:0 8px 24px rgba(0,0,0,.02),0 2px 6px rgba(0,0,0,.01);transition:box-shadow .2s ease}.admin-container:hover{box-shadow:0 12px 32px rgba(0,0,0,.02),0 4px 12px rgba(0,0,0,.01);border-color:#e3dbd2}.admin-header{text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid #e6e0d8}.admin-header .shield-icon{font-size:36px;display:block;margin-bottom:8px}.admin-header h1{font-size:28px;font-weight:600;color:#2b241e;letter-spacing:1px}.admin-header .subtitle{color:#a39484;font-size:14px;margin-top:4px;letter-spacing:2px;font-weight:300}.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;margin-top:10px}.menu-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 20px;background:#faf9f7;border-radius:18px;text-decoration:none;color:#1f1b17;border:1px solid #edeae5;transition:all .25s ease;min-height:120px}.menu-item:hover{transform:translateY(-4px);background:#fff;border-color:#d6cbc0;box-shadow:0 8px 20px rgba(0,0,0,.04)}.menu-item:active{transform:translateY(0)}.menu-icon{font-size:28px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#f0ece6;border-radius:14px;margin-bottom:12px;transition:all .2s ease}.menu-item:hover .menu-icon{background:#e6e0d8}.menu-label{font-size:16px;font-weight:500;text-align:center;line-height:1.4}.menu-label small{display:block;font-size:12px;font-weight:400;color:#a39484;margin-top:4px}.admin-footer{text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid #f0ebe5;color:#c6b9ab;font-size:12px;letter-spacing:1px}.admin-footer .status-dot{display:inline-block;width:8px;height:8px;background:#4ade80;border-radius:50%;margin-right:8px;vertical-align:middle}.admin-footer .version{color:#d6cbc0}@media (max-width:640px){.admin-container{padding:24px 20px;border-radius:24px}.admin-header h1{font-size:24px}.menu-grid{grid-template-columns:1fr 1fr;gap:14px}.menu-item{padding:18px 12px;min-height:100px}.menu-icon{width:48px;height:48px;font-size:24px}}@media (max-width:400px){.menu-grid{grid-template-columns:1fr}.admin-container{padding:20px 16px}}</style></head><body><div class="glow" id="glow"></div><div class="admin-container"><div class="admin-header"><span class="shield-icon">🛡️</span><h1>管理员控制台</h1><p class="subtitle">翱三通史 · 后台管理</p></div><div class="menu-grid"><a href="./get-log" class="menu-item"><span class="menu-icon">📋</span> <span class="menu-label">查看日志 <small>系统运行记录</small> </span></a><a href="./maintenance" class="menu-item"><span class="menu-icon">⚙️</span> <span class="menu-label">管理服务器 <small>维护模式控制</small> </span></a><a href="./check-issues" class="menu-item"><span class="menu-icon">🔍</span> <span class="menu-label">查看错误 <small>异常汇总处理</small></span></a></div><div class="admin-footer"><span class="status-dot"></span> 系统运行中 · <span class="version">v3.0</span><br><span style="font-size:11px;opacity:.5">翱三通史 · 内部管理工具</span></div></div><script>const glow=document.getElementById("glow");document.addEventListener("mousemove",e=>{glow.style.left=e.clientX+"px",glow.style.top=e.clientY+"px"}),document.querySelectorAll(".menu-item").forEach(e=>{e.addEventListener("click",function(e){const t=document.createElement("span"),n=this.getBoundingClientRect(),o=Math.max(n.width,n.height),l=e.clientX-n.left-o/2,s=e.clientY-n.top-o/2;t.style.cssText=`\n                    position: absolute;\n                    width: ${o}px;\n                    height: ${o}px;\n                    left: ${l}px;\n                    top: ${s}px;\n                    background: rgba(255, 255, 255, 0.15);\n                    border-radius: 50%;\n                    transform: scale(0);\n                    animation: rippleEffect 0.6s ease-out forwards;\n                    pointer-events: none;\n                `,this.appendChild(t),setTimeout(()=>{t.remove()},700)})});const styleSheet=document.createElement("style");styleSheet.textContent="\n            @keyframes rippleEffect {\n                to {\n                    transform: scale(4);\n                    opacity: 0;\n                }\n            }\n        ",document.head.appendChild(styleSheet)</script></body></html>
