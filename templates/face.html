<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>翱三通史 - 人脸识别</title>
    <link rel="stylesheet" href="./../static/css/face.css">
</head>
<body>
<div id="toast-container"></div>

<div class="container">
    <header>
        <h1>🎭 人脸识别</h1>
        <p class="subtitle">拍摄人脸 · 设置新密码 · 一次提交</p>
    </header>

    <main class="main-content">
        <!-- ===== 左列：摄像头 ===== -->
        <section class="video-section" aria-labelledby="videoTitle">
            <div class="card-header">
                <span class="card-index">1</span>
                <h2 id="videoTitle" class="card-title">拍摄人脸</h2>
            </div>
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
            </div>
            <div class="video-controls">
                <button id="startCameraBtn" class="btn btn-primary">📷 启动摄像头</button>
                <button id="captureBtn" class="btn btn-success" disabled>🎯 识别并提交</button>
                <button id="stopCameraBtn" class="btn btn-warning" disabled>⏹️ 关闭摄像头</button>
            </div>
        </section>

        <!-- ===== 右列：表单与结果 ===== -->
        <section class="control-section">
            <!-- 步骤 2：设置新密码 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-index">2</span>
                    <h2 class="card-title">设置新密码</h2>
                </div>
                <p class="card-desc">识别通过后将使用该密码重置账户密码。</p>
                <div class="input-with-action">
                    <input id="newPassword" class="text-input" type="password"
                           placeholder="请输入新密码" autocomplete="new-password">
                    <button id="togglePwd" class="input-action-btn" type="button">显示</button>
                </div>
            </div>

            <!-- 步骤 3：识别结果 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-index">3</span>
                    <h2 class="card-title">识别结果</h2>
                </div>
                <div id="resultArea" class="result-area">
                    <div class="info-message">等待识别，按下「🎯 识别并提交」开始</div>
                </div>
            </div>

            <a href="/issues" class="help-link">识别失败？向安全中心反映问题 →</a>
        </section>
    </main>
</div>

<script>
    // ==================== 状态与 DOM ====================
    let videoStream = null;
    let isRecognizing = false;

    const video = document.getElementById('video');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const ctx = overlayCanvas.getContext('2d');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const resultArea = document.getElementById('resultArea');
    const newPasswordInput = document.getElementById('newPassword');
    const togglePwdBtn = document.getElementById('togglePwd');

    // ==================== Toast ====================
    function showToast(message, type = 'info', duration = 3000) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // ==================== 摄像头 ====================
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
            });
            videoStream = stream;
            video.srcObject = stream;
            await video.play();

            overlayCanvas.width = video.videoWidth;
            overlayCanvas.height = video.videoHeight;

            startCameraBtn.disabled = true;
            captureBtn.disabled = false;
            stopCameraBtn.disabled = false;
        } catch (error) {
            console.error('摄像头启动失败:', error);
            showToast('无法访问摄像头，请检查权限设置', 'error', 4000);
        }
    }

    function stopCamera() {
        if (!videoStream) return;
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
        video.srcObject = null;

        startCameraBtn.disabled = false;
        captureBtn.disabled = true;
        stopCameraBtn.disabled = true;

        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    function captureCurrentFrame() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const tempCtx = canvas.getContext('2d');

        // 与预览一致，保持镜像
        tempCtx.save();
        tempCtx.scale(-1, 1);
        tempCtx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        tempCtx.restore();

        return canvas.toDataURL('image/jpeg', 0.8);
    }

    // ==================== 识别 + 重置密码 ====================
    async function captureAndRecognize() {
        if (!videoStream || isRecognizing) return;

        // 1. 采集密码
        const pwd = newPasswordInput.value;
        if (!pwd) {
            showToast('请先输入新密码，再进行人脸识别', 'warning');
            newPasswordInput.focus();
            return;
        }

        // 2. 采集人脸帧
        let imageData;
        try {
            imageData = captureCurrentFrame();
        } catch (e) {
            showToast('画面采集失败：' + e.message, 'error', 4000);
            return;
        }

        // 3. 确认提交
        if (!window.confirm('已采集人脸图像和新密码，确认提交？')) {
            showToast('已取消提交', 'info');
            return;
        }

        isRecognizing = true;
        captureBtn.disabled = true;

        resultArea.innerHTML = `
            <div class="info-message">
                🤔 识别中...
                <progress id="recognize-process" max="0"></progress>
            </div>
        `;

        try {
            // 4. 后端识别人脸
            const response = await fetch('/face/recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
            if (!response.ok) throw new Error(`服务返回 ${response.status}`);
            const result = await response.json();

            if (result.status !== 'success') {
                resultArea.innerHTML = `<div class="info-message">❌ 人脸识别失败：${result.message || '未知错误'}</div>`;
                showToast(`人脸存在问题：${result.message || '识别失败'}`, 'error', 5000);
                return;
            }

            // 5. 校验当前登录账号与人脸一致
            let currentUser = null;
            try {
                const res = await fetch('/api/currentUser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const userData = await res.json();
                currentUser = userData.user ?? userData.username ?? null;
            } catch (e) {
                console.warn('获取当前用户失败:', e);
            }

            if (!currentUser) {
                resultArea.innerHTML = `<div class="info-message">⚠️ 无法获取当前登录账号，请重新登录</div>`;
                showToast('无法获取当前登录账号，请重新登录', 'error', 5000);
                return;
            }
            if (currentUser !== result.user) {
                resultArea.innerHTML = `<div class="info-message">⚠️ 登录账号（${currentUser}）与识别人像（${result.user}）不一致</div>`;
                showToast('登录账号和识别人像不一致，请重新登录或再次拍摄', 'error', 5000);
                return;
            }

            // 6. 保存新密码
            resultArea.innerHTML = `<div class="info-message">识别用户为：${result.user}，正在保存密码……</div>`;
            const saved = await savePassword(result.user_id, pwd);
            if (!saved) {
                resultArea.innerHTML = `<div class="info-message">❌ 密码保存失败，请重试</div>`;
                showToast('密码修改失败，请重试', 'error', 5000);
                return;
            }

            // 7. 成功跳转
            resultArea.innerHTML = `<div class="info-message">✅ 识别用户为：${result.user}，密码已更新，正在跳转……</div>`;
            showToast('密码修改成功，正在跳转', 'success', 2000);

            newPasswordInput.value = '';
            sessionStorage.setItem('user', result.user);
            sessionStorage.setItem('isTeacher', result.isT);
            sessionStorage.setItem('userID', result.user_id);
            setTimeout(() => { window.location.href = '/'; }, 1500);
        } catch (error) {
            console.error('识别请求失败:', error);
            resultArea.innerHTML = `<div class="info-message">❌ 连接后端失败：${error.message}</div>`;
            showToast(`请求失败：${error.message}`, 'error', 5000);
        } finally {
            isRecognizing = false;
            captureBtn.disabled = false;
        }
    }

    async function savePassword(id, pwd) {
        try {
            const res = await fetch('/api/saveUser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: id, pwd, settings: 'default', a: true })
            });
            const data = await res.json();
            return data.status === 'success';
        } catch (e) {
            console.error('保存密码失败:', e);
            return false;
        }
    }

    // ==================== 事件绑定 ====================
    startCameraBtn.addEventListener('click', startCamera);
    stopCameraBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', captureAndRecognize);

    togglePwdBtn.addEventListener('click', () => {
        const isPwd = newPasswordInput.type === 'password';
        newPasswordInput.type = isPwd ? 'text' : 'password';
        togglePwdBtn.textContent = isPwd ? '隐藏' : '显示';
    });
</script>
</body>
</html>
