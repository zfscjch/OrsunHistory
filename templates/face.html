<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>翱三通史 - 人脸识别系统</title><link rel="stylesheet" href="./../static/css/face.css"><script defer="defer">function dialog(e,c,o="text",r=!0){return new Promise((t,n)=>{const u=document.querySelector("#ensure-sth"),l=document.querySelector("#description"),s=document.querySelector("#question");l.innerHTML=e,s.placeholder=c,s.type=o,s.required=r,s.value="",u.showModal(),document.querySelector("#sure").onclick=()=>{const e=s.value.trim();(!r||r&&e)&&(u.close(),t(e))},document.querySelector("#cancel").onclick=()=>{u.close(),n("cancel by user")},s.onkeypress=e=>{"Enter"===e.key&&document.querySelector("#sure").click()},u.onclick=e=>{e.target===u&&(u.close(),n("cancel by user"))}})}</script></head><body><dialog id="ensure-sth"><div class="dialog-content"><label for="question" id="description"></label> <input id="question"><div class="button-group"><button class="close-btn" id="sure">确定</button> <button class="close-btn" id="cancel">取消</button></div></div></dialog><div class="container"><header><h1>🎭 人脸识别系统</h1><p class="subtitle">前后端分离 | 实时识别</p></header><div class="main-content"><div class="video-section"><div class="video-container"><video id="video" autoplay muted playsinline></video><canvas id="overlayCanvas" class="overlay-canvas"></canvas></div><div class="video-controls"><button id="startCameraBtn" class="btn btn-primary">📷 启动摄像头</button> <button id="captureBtn" class="btn btn-success" disabled="disabled">🎯 识别当前画面</button> <button id="stopCameraBtn" class="btn btn-warning" disabled="disabled">⏹️ 关闭摄像头</button></div></div><div class="control-section"><div class="result-panel"><h3>🔍 识别结果</h3><div id="resultArea" class="result-area"><div class="info-message">等待识别...</div></div></div><div><a href="/issues">识别失败？向安全中心反映问题</a></div></div></div></div><script>let videoStream=null,isRecognizing=!1;const video=document.getElementById("video"),overlayCanvas=document.getElementById("overlayCanvas"),ctx=overlayCanvas.getContext("2d"),startCameraBtn=document.getElementById("startCameraBtn"),captureBtn=document.getElementById("captureBtn"),stopCameraBtn=document.getElementById("stopCameraBtn"),resultArea=document.getElementById("resultArea");async function startCamera(){try{const e=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:"user"}});videoStream=e,video.srcObject=e,await video.play(),overlayCanvas.width=video.videoWidth,overlayCanvas.height=video.videoHeight,startCameraBtn.disabled=!0,captureBtn.disabled=!1,stopCameraBtn.disabled=!1,console.log("摄像头已启动")}catch(e){console.error("摄像头启动失败:",e),alert("无法访问摄像头，请检查权限设置")}}function stopCamera(){videoStream&&(videoStream.getTracks().forEach(e=>e.stop()),videoStream=null,video.srcObject=null,startCameraBtn.disabled=!1,captureBtn.disabled=!0,stopCameraBtn.disabled=!0,ctx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height),console.log("摄像头已关闭"))}async function captureAndRecognize(){if(videoStream&&!isRecognizing){isRecognizing=!0,captureBtn.disabled=!0;try{const e=captureCurrentFrame();resultArea.innerHTML='<div class="info-message">🤔 识别中...</div>';const t=await fetch("/face/recognize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:e})});if(!t.ok)throw new Error(`HTTP ${t.status}: ${t.statusText}`);const a=await t.json();if(console.log(a),"success"===a.status){const e=sessionStorage.getItem("user");if(e!==a.user)return void alert("登录账号和识别人像不一致，请重新登录或再次拍摄！");resultArea.innerHTML=`识别用户为：${a.user}，正在跳转……`;const t=await dialog(`识别用户为：${a.user}，为确保安全，请重置密码`,"请输入重置密码","password");savePassword(a.user_id,t),sessionStorage.setItem("user",a.user),sessionStorage.setItem("isTeacher",a.isT),sessionStorage.setItem("userID",a.user_id),setTimeout(()=>{window.location.href="/"},1e3)}else resultArea.innerHTML=`<div class="info-message">❌ 识别失败: ${a.message}</div>`}catch(e){console.error("识别请求失败:",e),resultArea.innerHTML=`<div class="info-message">❌ 连接后端失败: ${e.message}</div>`}finally{isRecognizing=!1,captureBtn.disabled=!1}}}function savePassword(e,t){fetch("/api/savePwd",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:e,pwd:t,a:!0})}).then(e=>e.json()).then(e=>{console.log(e),"success"===e.status&&alert("密码保存成功！")}).catch(e=>{console.log(e),alert("密码保存失败！")})}function captureCurrentFrame(){const e=document.createElement("canvas");e.width=video.videoWidth,e.height=video.videoHeight;const t=e.getContext("2d");return t.save(),t.scale(-1,1),t.drawImage(video,-e.width,0,e.width,e.height),t.restore(),e.toDataURL("image/jpeg",.8)}startCameraBtn.addEventListener("click",startCamera),stopCameraBtn.addEventListener("click",stopCamera),captureBtn.addEventListener("click",captureAndRecognize)</script></body></html>
