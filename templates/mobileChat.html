<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天 - 翱三通史</title>
    <script src="./../static/js/socket.io.js"></script>
    <style>
        /* ========== 全局重置 & 变量 ========== */
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --primary-light: #7c8cf5;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --sidebar-bg: #2c3e50;
            --sidebar-header: #34495e;
            --sidebar-border: #3d566e;
            --text-light: #95a5a6;
            --text-white: #ffffff;
            --message-self: #667eea;
            --message-other: #ffffff;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-height: 56px;
            --tab-height: 48px;
            --input-height: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }

        /* ========== Dialog ========== */
        dialog#ensure-sth {
            border: none;
            border-radius: var(--radius);
            padding: 0;
            box-shadow: var(--shadow);
            max-width: 340px;
            width: 90%;
            background: transparent;
        }
        dialog#ensure-sth::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .dialog-content {
            background: white;
            border-radius: var(--radius);
            padding: 24px 20px 20px;
        }
        .dialog-content label {
            display: block;
            font-size: 15px;
            color: #333;
            margin-bottom: 14px;
            line-height: 1.6;
        }
        .dialog-content input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8ecf1;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.25s;
            outline: none;
            background: #fafbfc;
        }
        .dialog-content input:focus {
            border-color: var(--primary);
        }
        .dialog-content .button-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        .dialog-content .button-group button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .dialog-content .button-group button:active {
            opacity: 0.7;
        }
        .dialog-content .button-group #sure {
            background: var(--primary);
            color: white;
        }
        .dialog-content .button-group #cancel {
            background: #f0f0f0;
            color: #666;
        }

        /* ========== 好友请求 Dialog ========== */
        #request-dialog {
            border: none;
            border-radius: var(--radius);
            padding: 0;
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 92%;
            background: transparent;
        }
        #request-dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        #request-dialog .dialog-inner {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        #request-dialog .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        #request-dialog .dialog-header h3 {
            font-size: 17px;
            margin: 0;
        }
        #request-dialog .dialog-header button {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            padding: 0 4px;
            color: #999;
        }
        #request-dialog .dialog-body {
            overflow-y: auto;
            flex: 1;
        }

        #request-list-container .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        #request-list-container .request-item:last-child {
            border-bottom: none;
        }
        #request-list-container .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        #request-list-container .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            font-size: 14px;
        }
        #request-list-container .user-name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #request-list-container .request-type {
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 10px;
            color: white;
            margin-left: 4px;
            flex-shrink: 0;
        }
        #request-list-container .request-type.received {
            background: #e67e22;
        }
        #request-list-container .request-type.sent {
            background: #3498db;
        }
        #request-list-container .request-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        #request-list-container .request-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        #request-list-container .request-actions button:active {
            opacity: 0.7;
        }
        #request-list-container .btn-accept {
            background: #2ecc71;
            color: white;
        }
        #request-list-container .btn-reject {
            background: #e74c3c;
            color: white;
        }
        #request-list-container .btn-cancel {
            background: #95a5a6;
            color: white;
        }
        #request-list-container .empty-requests {
            text-align: center;
            color: #999;
            padding: 30px 0;
            font-size: 14px;
        }

        /* ========== App ========== */
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
        }

        /* ========== 登录页 ========== */
        #login-section {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #login-section.hidden {
            display: none;
        }
        .login-container {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 16px;
            padding: 36px 28px 32px;
            box-shadow: var(--shadow);
        }
        .login-container h2 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 4px;
        }
        .login-container .subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .login-container .form-group {
            margin-bottom: 14px;
        }
        .login-container .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.25s;
            outline: none;
            background: #fafbfc;
        }
        .login-container .form-group input:focus {
            border-color: var(--primary);
        }
        .login-container .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-container .login-btn:active {
            opacity: 0.8;
        }
        .login-container .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }
        .login-container .hint {
            font-size: 11px;
            color: #b0b8c4;
            text-align: center;
            margin-top: 14px;
            line-height: 1.6;
        }

        /* ========== 聊天主界面 ========== */
        #chat-section {
            display: none;
            width: 100%;
            height: 100%;
            background: #f7f8fa;
            flex-direction: column;
        }
        #chat-section.visible {
            display: flex;
        }

        /* ========== 顶部导航 ========== */
        .chat-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            padding-top: calc(8px + var(--safe-top));
            background: var(--sidebar-header);
            color: white;
            flex-shrink: 0;
            min-height: var(--header-height);
            position: relative;
            z-index: 10;
        }
        .chat-nav .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .chat-nav .nav-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
            background: var(--primary);
        }
        .chat-nav .nav-info {
            min-width: 0;
        }
        .chat-nav .nav-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-nav .nav-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }
        .chat-nav .nav-status.online {
            color: #2ecc71;
        }
        .chat-nav .nav-actions {
            display: flex;
            gap: 6px;
        }
        .chat-nav .nav-actions button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-nav .nav-actions button:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .chat-nav .nav-actions .badge-btn {
            position: relative;
        }
        .chat-nav .nav-actions .badge-btn .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--sidebar-header);
        }
        .chat-nav .nav-actions .badge-btn .badge-dot.show {
            display: flex;
        }

        /* ========== 好友列表（侧栏抽屉） ========== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.open {
            display: block;
            opacity: 1;
        }
        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 80%;
            max-width: 320px;
            height: 100%;
            background: var(--sidebar-bg);
            color: white;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
        }
        .drawer.open {
            transform: translateX(0);
        }

        .drawer-user {
            padding: 16px 20px 14px;
            background: var(--sidebar-header);
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        .drawer-user .nickname {
            font-size: 17px;
            font-weight: 700;
        }
        .drawer-user .username {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }
        .drawer-user .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            margin-right: 6px;
        }

        .drawer-search {
            padding: 10px 16px;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        .drawer-search .search-wrapper {
            display: flex;
            gap: 6px;
            background: #3d566e;
            border-radius: 8px;
            padding: 4px 12px;
            align-items: center;
        }
        .drawer-search .search-wrapper input {
            flex: 1;
            padding: 8px 4px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }
        .drawer-search .search-wrapper input::placeholder {
            color: #8aa3b8;
        }
        .drawer-search .search-wrapper .search-icon {
            color: #8aa3b8;
            font-size: 16px;
        }
        .drawer-search .search-wrapper .clear-btn {
            background: none;
            border: none;
            color: #8aa3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: none;
        }
        .drawer-search .search-wrapper .clear-btn.visible {
            display: block;
        }
        .search-results {
            display: none;
            max-height: 160px;
            overflow-y: auto;
            background: #34495e;
            border-radius: 8px;
            margin-top: 6px;
            padding: 4px 0;
        }
        .search-results.visible {
            display: block;
        }
        .search-results .result-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3d566e;
            font-size: 13px;
        }
        .search-results .result-item:last-child {
            border-bottom: none;
        }
        .search-results .result-item .result-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-results .result-item .add-btn {
            padding: 4px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .search-results .result-item .add-btn:active {
            opacity: 0.7;
        }
        .search-results .no-result {
            padding: 14px;
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
        }

        .drawer-tabs {
            display: flex;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }
        .drawer-tabs .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: var(--sidebar-header);
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        .drawer-tabs .tab.active {
            background: var(--sidebar-bg);
            color: white;
            border-bottom-color: var(--primary);
        }

        .drawer-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .drawer-list .list-empty {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            padding: 40px 20px;
        }
        .drawer-list .chat-item {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .drawer-list .chat-item:active {
            background: #34495e;
        }
        .drawer-list .chat-item.active {
            background: #34495e;
        }
        .drawer-list .chat-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            color: white;
        }
        .drawer-list .chat-item .avatar.friend {
            background: var(--primary);
        }
        .drawer-list .chat-item .avatar.group {
            background: #e67e22;
        }
        .drawer-list .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .drawer-list .chat-item .info .name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .drawer-list .chat-item .info .status {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 1px;
        }
        .drawer-list .chat-item .info .status.online {
            color: #2ecc71;
        }
        .drawer-list .chat-item .info .status.offline {
            color: #7f8c8d;
        }
        .drawer-list .chat-item .badge {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            min-width: 20px;
            text-align: center;
        }

        /* ========== 消息区域 ========== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            padding-bottom: 8px;
            background: #f7f8fa;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }
        .message-time {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 6px 0;
            margin: 2px 0;
            width: 100%;
        }
        .message-sender {
            font-size: 11px;
            color: #888;
            margin-bottom: 1px;
            font-weight: 500;
            padding: 0 4px;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            width: 100%;
        }
        .message-wrapper.self {
            align-items: flex-end;
        }
        .message-wrapper.other {
            align-items: flex-start;
        }
        .message {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
            display: inline-block;
        }
        .message.sent {
            background: var(--message-self);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            background: var(--message-other);
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .file-message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: var(--message-other);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            max-width: 260px;
            border: 1px solid #e8ecf1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .file-message:active {
            background: #f0f2f5;
        }
        .file-message.sent {
            background: var(--message-self);
            color: white;
            border-color: var(--primary-dark);
        }
        .file-message.sent:active {
            background: var(--primary-dark);
        }
        .file-message .file-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .file-message .file-icon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .file-message .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-message .file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-message .file-size {
            font-size: 10px;
            opacity: 0.7;
        }
        .file-message .download-icon {
            font-size: 16px;
            opacity: 0.6;
            flex-shrink: 0;
        }

        /* ========== 输入区域 ========== */
        .chat-input {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            padding-bottom: calc(8px + var(--safe-bottom));
            background: white;
            border-top: 1px solid #e8ecf1;
            flex-shrink: 0;
            align-items: center;
            min-height: var(--input-height);
        }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border 0.25s;
            background: #fafbfc;
            min-height: 40px;
        }
        .chat-input input[type="text"]:focus {
            border-color: var(--primary);
        }
        .chat-input input[type="text"]:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        .chat-input .btn-send {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            min-height: 40px;
        }
        .chat-input .btn-send:active:not(:disabled) {
            opacity: 0.8;
        }
        .chat-input .btn-send:disabled {
            background: #c5cbd5;
            cursor: not-allowed;
        }
        .chat-input .btn-file {
            padding: 0;
            background: #f0f2f5;
            border: 2px solid #e8ecf1;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: border 0.25s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
            border-color: transparent;
        }
        .chat-input .btn-file:active:not(:disabled) {
            background: #e4e7ed;
        }
        .chat-input .btn-file:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .chat-input input[type="file"] {
            display: none;
        }

        .chat-footer {
            text-align: center;
            padding: 4px 0 6px;
            font-size: 9px;
            color: #c5cbd5;
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #f0f2f5;
        }

        /* ========== 空状态 ========== */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #bbb;
            font-size: 16px;
            padding: 40px;
        }
        .empty-chat .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-chat .sub {
            font-size: 13px;
            color: #ccc;
            margin-top: 4px;
        }

        /* ========== 工具类 ========== */
        .hidden {
            display: none !important;
        }
        .flex-1 {
            flex: 1;
        }
    </style>
</head>
<body>

<!-- ========== Dialog ========== -->
<dialog id="ensure-sth">
    <div class="dialog-content">
        <label id="description"></label>
        <input id="question" type="text" placeholder="">
        <div class="button-group">
            <button id="sure">确定</button>
            <button id="cancel">取消</button>
        </div>
    </div>
</dialog>

<!-- ========== 好友请求 Dialog ========== -->
<dialog id="request-dialog">
    <div class="dialog-inner">
        <div class="dialog-header">
            <h3>📨 好友请求</h3>
            <button onclick="document.getElementById('request-dialog').close();">&times;</button>
        </div>
        <div class="dialog-body" id="request-list-container">
            <div class="empty-requests">加载中...</div>
        </div>
    </div>
</dialog>

<!-- ========== App ========== -->
<div id="app">

    <!-- ===== 登录页 ===== -->
    <div id="login-section">
        <div class="login-container">
            <h2>💬 翱三通史</h2>
            <p class="subtitle">连接你我，畅聊无限</p>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="真实姓名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码（学号 / 111111）" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="start-login">登 录</button>
                <div id="errorMessage" class="error-message"></div>
                <div class="hint">
                    学生：真实姓名 + 学号 &nbsp;|&nbsp; 老师：真实姓名 + 111111
                </div>
            </form>
        </div>
    </div>

    <!-- ===== 聊天主界面 ===== -->
    <div id="chat-section">
        <!-- 顶部导航 -->
        <div class="chat-nav">
            <div class="nav-left">
                <button id="menu-toggle" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;padding:4px;">☰</button>
                <div class="nav-avatar" id="nav-avatar">?</div>
                <div class="nav-info">
                    <div class="nav-name" id="nav-title">请选择聊天</div>
                    <div class="nav-status" id="nav-status"></div>
                </div>
            </div>
            <div class="nav-actions">
                <button class="badge-btn" onclick="openRequestDialog()" title="好友请求">
                    📨
                    <span class="badge-dot" id="request-badge">0</span>
                </button>
                <button onclick="logout()" title="退出">🚪</button>
            </div>
        </div>

        <!-- 消息区域 -->
        <div class="chat-messages" id="messages">
            <div class="empty-chat">
                <div class="icon">💬</div>
                <div>选择好友开始聊天</div>
                <div class="sub">点击左上角菜单查看联系人</div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="输入消息..." disabled>
            <button class="btn-file" onclick="sendFile()" disabled title="发送文件">📎</button>
            <input type="file" id="file-input" multiple disabled>
            <button class="btn-send" onclick="sendMessage()" disabled>发送</button>
        </div>

        <div class="chat-footer">2025-2026 CoderChat</div>
    </div>
</div>

<!-- ===== 抽屉菜单 ===== -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
    <div class="drawer-user">
        <div class="nickname"><span class="status-dot"></span><span id="sidebar-nickname">未登录</span></div>
        <div class="username" id="sidebar-username">@unknown</div>
    </div>

    <div class="drawer-search">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="搜索用户..." maxlength="20">
            <button class="clear-btn" id="clear-search">✕</button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <div class="drawer-tabs">
        <div class="tab active" data-tab="friends" id="tab-friends">👥 好友</div>
        <div class="tab" data-tab="groups" id="tab-groups">📚 群聊</div>
    </div>

    <div class="drawer-list" id="friends-list">
        <div class="list-empty">暂无好友<br>添加好友开始聊天吧</div>
    </div>

    <div class="drawer-list" id="groups-list" style="display:none;">
        <div class="list-empty">暂无群聊</div>
    </div>
</div>

<script>
    'use strict';

    // ========== 配置 ==========
    const SERVER_CONFIG = { http: ':65432', ws: ':65432' };

    // ========== DOM ==========
    const loginSection = document.getElementById('login-section');
    const chatSection = document.getElementById('chat-section');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const fileInput = document.getElementById('file-input');
    const sendButton = document.querySelector('.btn-send');
    const fileButton = document.querySelector('.btn-file');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMessage');
    const sidebarNickname = document.getElementById('sidebar-nickname');
    const sidebarUsername = document.getElementById('sidebar-username');
    const navTitle = document.getElementById('nav-title');
    const navStatus = document.getElementById('nav-status');
    const navAvatar = document.getElementById('nav-avatar');
    const friendsList = document.getElementById('friends-list');
    const groupsList = document.getElementById('groups-list');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const clearSearchBtn = document.getElementById('clear-search');
    const tabFriends = document.getElementById('tab-friends');
    const tabGroups = document.getElementById('tab-groups');
    const dialogEl = document.getElementById('ensure-sth');
    const dialogDesc = document.getElementById('description');
    const dialogInput = document.getElementById('question');
    const dialogSure = document.getElementById('sure');
    const dialogCancel = document.getElementById('cancel');
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const requestBadge = document.getElementById('request-badge');

    // ========== State ==========
    let currentUsername = '';
    let currentUserId = null;
    let lastTime = new Date('1970-01-01');
    let currentChat = null; // { type: 'friend'|'group', id, name, avatar? }
    let friends = [];
    let groups = [];
    let onlineUsers = new Set();
    let isLoggedIn = false;
    let unreadMap = {};
    let friendRequests = [];
    let pendingRequestCount = 0;

    // ========== Socket ==========
    const socket = io(SERVER_CONFIG.http, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000
    });

    // ========== 工具函数 ==========
    function getAvatarColor(name) {
        const colors = ['#667eea', '#e74c3c', '#2ecc71', '#f39c12', '#1abc9c', '#9b59b6', '#3498db', '#e67e22'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
    }

    function getInitials(name) {
        if (!name) return '?';
        return name.charAt(0).toUpperCase();
    }

    function formatFileSize(bytes) {
        if (!bytes) return '未知';
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileIcon(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        const map = {
            'jpg': 'image.png', 'jpeg': 'image.png', 'png': 'image.png',
            'gif': 'image.png', 'bmp': 'image.png', 'webp': 'image.png',
            'pdf': 'word.png', 'doc': 'word.png', 'docx': 'word.png',
            'txt': 'notepad.png', 'xls': 'excel.png', 'xlsx': 'excel.png',
            'ppt': 'ppt.png', 'pptx': 'ppt.png',
            'zip': 'zip.png', 'rar': 'zip.png', '7z': 'zip.png',
            'mp3': 'music.png', 'mp4': 'video.png', 'avi': 'video.png'
        };
        return map[ext] || 'all_file.png';
    }

    function basename(path) {
        return path.split('/').pop().split('\\').pop() || path;
    }

    // ========== Dialog ==========
    function dialog(message, placeholderText, type, isRequired) {
        return new Promise((resolve) => {
            dialogDesc.innerHTML = message;
            dialogInput.placeholder = placeholderText || '';
            dialogInput.type = type || 'text';
            dialogInput.required = isRequired !== false;
            dialogInput.value = '';
            dialogEl.showModal();

            dialogSure.onclick = () => {
                const answer = dialogInput.value.trim();
                if (!dialogInput.required || answer) {
                    dialogEl.close();
                    resolve(answer);
                }
            };
            dialogCancel.onclick = () => { dialogEl.close(); resolve(''); };
            dialogInput.onkeypress = (e) => { if (e.key === 'Enter') dialogSure.click(); };
            dialogEl.onclick = (e) => { if (e.target === dialogEl) { dialogEl.close(); resolve(''); } };
        });
    }

    // ========== 消息渲染 ==========
    class RenderMessage {
        constructor(messages) {
            if (!messages || messages.length === 0) return;
            // 移除空状态
            const empty = messagesDiv.querySelector('.empty-chat');
            if (empty) empty.remove();

            messages.forEach((msg) => {
                let sender, sendTime, textMsg, iconMsg, filePath;
                if (Array.isArray(msg)) {
                    sender = msg[0] || '未知';
                    sendTime = msg[1] || new Date().toISOString();
                    textMsg = msg[2] || '';
                    iconMsg = msg[3] || '';
                    filePath = msg[4] || '';
                } else if (typeof msg === 'object') {
                    sender = msg.from_user_id || msg.sender || '未知';
                    sendTime = msg.created_at || msg.sendTime || new Date().toISOString();
                    textMsg = msg.content || msg.textMsg || '';
                    iconMsg = msg.iconMsg || '';
                    filePath = msg.filePath || '';
                } else return;

                this.sender = sender;
                this.sendTime = sendTime;
                this.textMsg = textMsg;
                this.iconMsg = iconMsg;
                this.filePath = filePath;
                this.render();
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        getTime(time) {
            const d = new Date(time);
            const now = new Date();
            const mins = Math.floor((now - d) / 60000);
            if (mins < 1) return ['刚刚', d];
            if (mins < 60) return [`${mins}分钟前`, d];
            if (now.toDateString() === d.toDateString()) {
                return [`今天 ${d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}`, d];
            }
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            if (now.getDate() - d.getDate() < 7 && now.getMonth() === d.getMonth()) {
                return [`${weekdays[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, d];
            }
            if (now.getFullYear() === d.getFullYear()) {
                return [`${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, d];
            }
            return [`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`, d];
        }

        shouldShowTime(date) {
            if (date.getTime() - lastTime.getTime() > 10 * 60000) {
                lastTime = date;
                return true;
            }
            lastTime = date;
            return false;
        }

        render() {
            const dateTime = new Date(this.sendTime);
            const [timeStr] = this.getTime(this.sendTime);
            const showTime = this.shouldShowTime(dateTime);

            const wrapper = document.createElement('div');
            const isSelf = String(this.sender) === String(currentUserId) || this.sender === currentUsername;
            wrapper.className = `message-wrapper ${isSelf ? 'self' : 'other'}`;

            if (showTime) {
                const timeEl = document.createElement('div');
                timeEl.className = 'message-time';
                timeEl.textContent = timeStr;
                wrapper.appendChild(timeEl);
            }

            const senderEl = document.createElement('div');
            senderEl.className = 'message-sender';
            senderEl.textContent = isSelf ? '我' : this.sender;
            wrapper.appendChild(senderEl);

            const isFileMsg = this.filePath || (this.textMsg && this.textMsg.startsWith('{') && this.textMsg.includes('file_id'));

            if (isFileMsg) {
                let fileInfo;
                try { fileInfo = JSON.parse(this.textMsg); } catch { fileInfo = { file_name: basename(this.filePath || this.textMsg), file_id: 'unknown' }; }

                const fileDiv = document.createElement('div');
                fileDiv.className = `file-message ${isSelf ? 'sent' : ''}`;

                const iconDiv = document.createElement('div');
                iconDiv.className = 'file-icon';
                const iconImg = document.createElement('img');
                iconImg.src = this.iconMsg || `../static/icon/${getFileIcon(fileInfo.file_name || 'file')}`;
                iconImg.alt = '文件';
                iconDiv.appendChild(iconImg);

                const infoDiv = document.createElement('div');
                infoDiv.className = 'file-info';
                const nameDiv = document.createElement('div');
                nameDiv.className = 'file-name';
                nameDiv.textContent = fileInfo.file_name || '未知文件';
                const sizeDiv = document.createElement('div');
                sizeDiv.className = 'file-size';
                sizeDiv.textContent = fileInfo.file_size ? formatFileSize(fileInfo.file_size) : '点击下载';

                infoDiv.appendChild(nameDiv);
                infoDiv.appendChild(sizeDiv);

                const downloadDiv = document.createElement('div');
                downloadDiv.className = 'download-icon';
                downloadDiv.textContent = '⬇️';

                fileDiv.appendChild(iconDiv);
                fileDiv.appendChild(infoDiv);
                fileDiv.appendChild(downloadDiv);

                fileDiv.onclick = () => { requestFileDownload(fileInfo.file_id || 'unknown'); };
                wrapper.appendChild(fileDiv);
            } else if (this.textMsg) {
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isSelf ? 'sent' : 'received'}`;
                msgEl.textContent = this.textMsg;
                wrapper.appendChild(msgEl);
            }

            messagesDiv.appendChild(wrapper);
        }
    }

    // ========== 文件下载 ==========
    function requestFileDownload(fileId) {
        fetch(`${SERVER_CONFIG.http}/download/request_file`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ file_id: fileId, user_id: currentUserId })
        })
            .then(r => r.json())
            .then(data => {
                if (data.success && data.download_url) {
                    window.open(data.download_url, '_blank');
                } else {
                    alert('下载失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(err => { alert('请求下载失败: ' + err.message); });
    }

    // ========== 渲染列表 ==========
    function renderFriends() {
        if (friends.length === 0) {
            friendsList.innerHTML = '<div class="list-empty">暂无好友<br>添加好友开始聊天吧</div>';
            return;
        }
        let html = '';
        friends.forEach(f => {
            const fid = f.user_id || f.id;
            const isOnline = onlineUsers.has(String(fid));
            const name = f.nickname || f.username || f.name || '未知';
            const unread = unreadMap[String(fid)] || 0;
            const active = currentChat && currentChat.type === 'friend' && String(currentChat.id) === String(fid);

            html += `
                <div class="chat-item ${active ? 'active' : ''}" onclick="selectFriend('${fid}', '${name}')">
                    <div class="avatar friend" style="background:${getAvatarColor(name)}">${getInitials(name)}</div>
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="status ${isOnline ? 'online' : 'offline'}">${isOnline ? '在线' : '离线'}</div>
                    </div>
                    ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
                </div>
            `;
        });
        friendsList.innerHTML = html;
    }

    function renderGroups() {
        if (groups.length === 0) {
            groupsList.innerHTML = '<div class="list-empty">暂无群聊</div>';
            return;
        }
        let html = '';
        groups.forEach(g => {
            const gid = g.group_id || g.id;
            const name = g.group_name || g.name || '群聊';
            const active = currentChat && currentChat.type === 'group' && String(currentChat.id) === String(gid);
            html += `
                <div class="chat-item ${active ? 'active' : ''}" onclick="selectGroup('${gid}', '${name}')">
                    <div class="avatar group">📚</div>
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="status">${g.member_count || 0} 人</div>
                    </div>
                </div>
            `;
        });
        groupsList.innerHTML = html;
    }

    // ========== 选择聊天 ==========
    window.selectFriend = function(id, name) {
        socket.emit('message', { type: 'mark_read', data: { friend_id: parseInt(id) } });
        updateUnreadCount(id, 0);

        currentChat = { type: 'friend', id: id, name: name };
        const isOnline = onlineUsers.has(String(id));
        navTitle.textContent = name;
        navStatus.textContent = isOnline ? '● 在线' : '○ 离线';
        navStatus.className = 'nav-status ' + (isOnline ? 'online' : '');
        navAvatar.textContent = getInitials(name);
        navAvatar.style.background = getAvatarColor(name);

        messagesDiv.innerHTML = '';
        socket.emit('message', { type: 'get_history', data: { chat_type: 'private', target_id: parseInt(id), limit: 50 } });
        updateActiveItem();
        enableChat();
        closeDrawer();
    };

    window.selectGroup = function(id, name) {
        currentChat = { type: 'group', id: id, name: name };
        navTitle.textContent = name;
        navStatus.textContent = '群聊';
        navStatus.className = 'nav-status';
        navAvatar.textContent = '📚';
        navAvatar.style.background = '#e67e22';

        messagesDiv.innerHTML = '';
        socket.emit('message', { type: 'get_history', data: { chat_type: 'group', target_id: parseInt(id), limit: 50 } });
        updateActiveItem();
        enableChat();
        closeDrawer();
    };

    function enableChat() {
        messageInput.disabled = false;
        sendButton.disabled = false;
        fileButton.disabled = false;
        fileInput.disabled = false;
        messageInput.focus();
    }

    function updateActiveItem() {
        document.querySelectorAll('.drawer-list .chat-item').forEach(el => el.classList.remove('active'));
        if (!currentChat) return;
        const selector = `.drawer-list .chat-item[data-id="${currentChat.id}"]`;
        const el = document.querySelector(selector);
        if (el) el.classList.add('active');
    }

    function updateUnreadCount(friendId, count) {
        const idStr = String(friendId);
        if (count === 0) delete unreadMap[idStr];
        else unreadMap[idStr] = count;
        renderFriends();
    }

    function updateFriendOnlineStatus(userId, status) {
        const idStr = String(userId);
        if (status === 'online') onlineUsers.add(idStr);
        else onlineUsers.delete(idStr);

        if (currentChat && currentChat.type === 'friend' && String(currentChat.id) === idStr) {
            const isOnline = onlineUsers.has(idStr);
            navStatus.textContent = isOnline ? '● 在线' : '○ 离线';
            navStatus.className = 'nav-status ' + (isOnline ? 'online' : '');
        }
        renderFriends();
    }

    function updateRequestBadge(count) {
        pendingRequestCount = count;
        if (count > 0) {
            requestBadge.textContent = count > 99 ? '99+' : count;
            requestBadge.classList.add('show');
        } else {
            requestBadge.classList.remove('show');
        }
    }

    // ========== 抽屉控制 ==========
    function openDrawer() { drawer.classList.add('open'); drawerOverlay.classList.add('open'); }
    function closeDrawer() { drawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
    menuToggle.addEventListener('click', openDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // ========== 好友请求 ==========
    function openRequestDialog() {
        document.getElementById('request-dialog').showModal();
        fetchFriendRequests();
    }

    function fetchFriendRequests() {
        if (!currentUserId) return;
        socket.emit('message', JSON.stringify({ type: 'get_friend_requests', data: {} }));
    }

    function renderFriendRequests(requests) {
        const container = document.getElementById('request-list-container');
        if (!requests || requests.length === 0) {
            container.innerHTML = '<div class="empty-requests">暂无好友请求</div>';
            return;
        }
        let html = '';
        requests.forEach(req => {
            const isReceived = req.type === 'received';
            const displayName = req.nickname || req.username || `用户${req.friend_id}`;
            const timeStr = req.created_at ? new Date(req.created_at).toLocaleString('zh-CN', { hour12: false }) : '';
            html += `
                <div class="request-item">
                    <div class="user-info">
                        <div class="user-avatar" style="background:${getAvatarColor(displayName)}">${getInitials(displayName)}</div>
                        <div>
                            <span class="user-name">${displayName}</span>
                            <span class="request-type ${isReceived ? 'received' : 'sent'}">${isReceived ? '收到' : '已发送'}</span>
                            <div style="font-size:11px;color:#888;">${timeStr}</div>
                        </div>
                    </div>
                    <div class="request-actions">
                        ${isReceived ? `
                            <button class="btn-accept" onclick="handleFriendRequest('accept', ${req.friend_id})">接受</button>
                            <button class="btn-reject" onclick="handleFriendRequest('reject', ${req.friend_id})">拒绝</button>
                        ` : `
                            <button class="btn-cancel" onclick="cancelFriendRequest(${req.friend_id})">取消</button>
                        `}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function handleFriendRequest(action, friendId) {
        if (!currentUserId) return;
        socket.emit('message', JSON.stringify({ type: 'handle_friend_request', data: { action, friend_id: friendId } }));
    }

    function cancelFriendRequest(friendId) {
        if (!currentUserId) return;
        if (!confirm('确定取消该好友请求吗？')) return;
        socket.emit('message', JSON.stringify({ type: 'cancel_friend_request', data: { friend_id: friendId } }));
    }

    function startDirectChat(userId, userName) {
        selectFriend(userId, userName);
        socket.emit('message', { type: 'add_friend_direct', data: { friend_user_id: parseInt(userId) } });
        socket.emit('message', { type: 'get_friends' });
        searchResults.classList.remove('visible');
        searchInput.value = '';
        clearSearchBtn.classList.remove('visible');
    }

    // ========== 搜索 ==========
    function performSearch(query) {
        if (!query || query.length < 1) {
            searchResults.classList.remove('visible');
            return;
        }
        const results = friends.filter(f => {
            const name = (f.nickname || f.username || f.name || '').toLowerCase();
            return name.includes(query.toLowerCase());
        });

        if (results.length === 0) {
            searchResults.innerHTML = `
                <div class="result-item">
                    <span class="result-name">未找到"${query}"</span>
                    <button class="add-btn" onclick="searchUser('${query}')">搜索服务器</button>
                </div>
            `;
        } else {
            let html = '';
            results.forEach(f => {
                const name = f.nickname || f.username || f.name || '未知';
                const fid = f.user_id || f.id;
                html += `
                    <div class="result-item" onclick="selectFriend('${fid}', '${name}')">
                        <span class="result-name">${name}</span>
                        <span>${onlineUsers.has(String(fid)) ? '🟢' : '⚪'}</span>
                    </div>
                `;
            });
            searchResults.innerHTML = html;
        }
        searchResults.classList.add('visible');
    }

    window.searchUser = function(query) {
        socket.emit('message', { type: 'search_user_by_name', data: { username: query } });
    };

    searchInput.addEventListener('input', function(e) {
        const query = e.target.value.trim();
        if (query.length > 0) {
            clearSearchBtn.classList.add('visible');
            performSearch(query);
        } else {
            clearSearchBtn.classList.remove('visible');
            searchResults.classList.remove('visible');
        }
    });

    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const query = e.target.value.trim();
            if (query) socket.emit('message', { type: 'search_user_by_name', data: { username: query } });
        }
    });

    clearSearchBtn.addEventListener('click', function() {
        searchInput.value = '';
        clearSearchBtn.classList.remove('visible');
        searchResults.classList.remove('visible');
        searchInput.focus();
    });

    // ========== Tab切换 ==========
    tabFriends.addEventListener('click', function() {
        tabFriends.classList.add('active');
        tabGroups.classList.remove('active');
        friendsList.style.display = 'block';
        groupsList.style.display = 'none';
        if (friends.length === 0) socket.emit('message', { type: 'get_friends' });
    });

    tabGroups.addEventListener('click', function() {
        tabGroups.classList.add('active');
        tabFriends.classList.remove('active');
        groupsList.style.display = 'block';
        friendsList.style.display = 'none';
        if (groups.length === 0) socket.emit('message', { type: 'get_groups' });
    });

    // ========== 发送消息 ==========
    function sendMessage() {
        const msg = messageInput.value.trim();
        if (!msg || !currentChat) return;

        if (currentChat.type === 'friend') {
            socket.emit('message', {
                type: 'private_chat',
                data: { to_user_id: parseInt(currentChat.id), content: msg, msg_type: 'text' }
            });
        } else if (currentChat.type === 'group') {
            socket.emit('message', {
                type: 'group_chat',
                data: { group_id: parseInt(currentChat.id), content: msg }
            });
        }

        const temp = [currentUsername, new Date().toISOString(), msg, '', ''];
        new RenderMessage([temp]);
        messageInput.value = '';
        messageInput.focus();
    }

    function sendFile() { fileInput.click(); }

    // ========== 文件上传 ==========
    async function uploadFile(file) {
        const chunkSize = 1024 * 1024;
        const totalChunks = Math.ceil(file.size / chunkSize);
        const fileId = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        const chatType = currentChat.type;
        const targetId = parseInt(currentChat.id);
        const toUserId = chatType === 'friend' ? targetId : null;
        const groupId = chatType === 'group' ? targetId : null;

        for (let i = 0; i < totalChunks; i++) {
            const start = i * chunkSize;
            const end = Math.min(start + chunkSize, file.size);
            const chunk = file.slice(start, end);

            const formData = new FormData();
            formData.append('file_id', fileId);
            formData.append('chunk_index', i);
            formData.append('total_chunks', totalChunks);
            formData.append('file_name', file.name);
            formData.append('file_size', file.size);
            formData.append('from_user_id', currentUserId);
            formData.append('to_user_id', toUserId || '');
            formData.append('chat_type', chatType);
            formData.append('target_id', targetId);
            formData.append('chunk', chunk);

            try {
                const resp = await fetch(`${SERVER_CONFIG.http}/upload/chunk`, { method: 'POST', body: formData });
                const result = await resp.json();

                if (result.success && result.file_info) {
                    const fileInfo = { file_id: fileId, file_name: file.name, file_size: file.size };
                    const fileInfoStr = JSON.stringify(fileInfo);

                    if (chatType === 'friend') {
                        socket.emit('message', {
                            type: 'private_chat',
                            data: { to_user_id: toUserId, content: fileInfoStr, msg_type: 'file' }
                        });
                    } else {
                        socket.emit('message', {
                            type: 'group_chat',
                            data: { group_id: groupId, content: fileInfoStr }
                        });
                    }

                    const iconPath = `../static/icon/${getFileIcon(file.name)}`;
                    const msg = [currentUsername, new Date().toISOString(), fileInfoStr, iconPath, ''];
                    new RenderMessage([msg]);
                    alert('文件上传成功！');
                    return;
                }
                if (!result.success) throw new Error(result.error || '上传失败');
            } catch (err) {
                alert('文件上传失败: ' + err.message);
                return;
            }
        }
    }

    // ========== 登录/登出 ==========
    function login() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if (!username || !password) { errorMsg.textContent = '请输入用户名和密码'; return; }
        errorMsg.textContent = '';
        socket.emit('message', { type: 'login', data: { username, password } });
    }

    function logout() {
        if (confirm('确定要退出吗？')) {
            socket.emit('message', { type: 'logout', data: {} });
        }
    }

    function handleLoginSuccess() {
        loginSection.classList.add('hidden');
        chatSection.classList.add('visible');
        errorMsg.textContent = '';
        messageInput.focus();

        socket.emit('message', { type: 'get_friends' });
        socket.emit('message', { type: 'get_groups' });
    }

    async function sendLoginMsgApi(username) {
        const password = await dialog('为确认身份，请再次输入密码：', '密码', 'password', true);
        if (password) {
            usernameInput.value = username;
            passwordInput.value = password;
            login();
        }
    }

    // ========== Socket 事件 ==========
    socket.on('message', function(message) {
        const type = message.type;
        const data = message.data;

        switch (type) {
            case 'login':
                if (data.success) {
                    currentUsername = usernameInput.value.trim();
                    currentUserId = data.user_id;
                    sidebarNickname.textContent = currentUsername;
                    sidebarUsername.textContent = '@' + currentUsername;
                    navAvatar.textContent = getInitials(currentUsername);
                    navAvatar.style.background = getAvatarColor(currentUsername);
                    isLoggedIn = true;
                    handleLoginSuccess();
                } else {
                    errorMsg.textContent = data.message || '登录失败';
                }
                break;

            case 'online_friends':
                (data.online_friends || []).forEach(id => onlineUsers.add(String(id)));
                renderFriends();
                break;

            case 'user_status':
                updateFriendOnlineStatus(data.user_id, data.status);
                break;

            case 'new_message':
                if (data) {
                    const fromId = data.from_user_id;
                    if (currentChat && currentChat.type === 'friend' && String(currentChat.id) === String(fromId)) {
                        const msg = [data.from_user_id, data.created_at, data.content, '', ''];
                        new RenderMessage([msg]);
                    } else {
                        const cur = unreadMap[String(fromId)] || 0;
                        updateUnreadCount(fromId, cur + 1);
                    }
                }
                break;

            case 'mark_read':
                break;

            case 'group_message':
                if (data) {
                    const msg = [data.from_user_id, data.created_at, data.content, '', ''];
                    new RenderMessage([msg]);
                }
                break;

            case 'get_friends':
                if (data.success && data.friends) {
                    friends = data.friends;
                    friends.forEach(f => {
                        const fid = String(f.user_id || f.id);
                        if (f.unread_count > 0) unreadMap[fid] = f.unread_count;
                        else delete unreadMap[fid];
                    });
                    renderFriends();
                }
                break;

            case 'get_groups':
                if (data.success && data.groups) {
                    groups = data.groups;
                    renderGroups();
                }
                break;

            case 'get_history':
                if (data.success && data.messages) {
                    new RenderMessage(data.messages);
                }
                break;

            case 'search_user_by_name':
                if (data.users && data.users.length > 0) {
                    let html = '';
                    data.users.forEach(u => {
                        if (String(u.user_id) === String(currentUserId)) return;
                        html += `
                            <div class="result-item">
                                <span class="result-name">${u.username}</span>
                                <button class="add-btn" onclick="startDirectChat('${u.user_id}', '${u.username}')">💬</button>
                            </div>
                        `;
                    });
                    searchResults.innerHTML = html || '<div class="no-result">未找到其他用户</div>';
                    searchResults.classList.add('visible');
                } else {
                    searchResults.innerHTML = '<div class="no-result">未找到用户</div>';
                    searchResults.classList.add('visible');
                }
                break;

            case 'add_friend':
                alert(data.success ? '好友请求已发送！' : (data.message || '添加失败'));
                if (data.success) socket.emit('message', { type: 'get_friends' });
                break;

            case 'get_friend_requests':
                if (data.success) {
                    friendRequests = data.requests || [];
                    updateRequestBadge(data.pending_count || 0);
                    const dialog = document.getElementById('request-dialog');
                    if (dialog.open) renderFriendRequests(friendRequests);
                }
                break;

            case 'handle_friend_request':
                if (data.success) {
                    alert(data.action === 'accept' ? '已接受好友请求' : '已拒绝好友请求');
                    fetchFriendRequests();
                    socket.emit('message', { type: 'get_friends' });
                } else {
                    alert('操作失败: ' + (data.message || ''));
                }
                break;

            case 'cancel_friend_request':
                alert(data.success ? '已取消好友请求' : '取消失败');
                if (data.success) fetchFriendRequests();
                break;

            case 'friend_request':
                alert(`收到来自用户 ${data.from_user_id} 的好友请求`);
                fetchFriendRequests();
                break;

            case 'friend_request_accepted':
                alert(`用户 ${data.user_id} 接受了您的好友请求`);
                fetchFriendRequests();
                socket.emit('message', { type: 'get_friends' });
                break;

            case 'friend_request_rejected':
                alert(`用户 ${data.user_id} 拒绝了您的好友请求`);
                fetchFriendRequests();
                break;

            case 'file_message':
                if (data) {
                    const msg = [data.from_user_id, data.created_at, data.content || '文件', data.iconMsg || '', data.filePath || ''];
                    new RenderMessage([msg]);
                }
                break;

            case 'request_file':
                if (data.success && data.download_url) window.open(data.download_url, '_blank');
                else alert('下载失败: ' + (data.message || ''));
                break;

            case 'error':
                if (data.message === '未登录') {
                    loginSection.classList.remove('hidden');
                    chatSection.classList.remove('visible');
                    isLoggedIn = false;
                }
                break;

            case 'logout':
                if (data.success) {
                    isLoggedIn = false;
                    loginSection.classList.remove('hidden');
                    chatSection.classList.remove('visible');
                    errorMsg.textContent = '已登出';
                }
                break;

            default:
                console.log('未处理:', type);
        }
    });

    socket.on('connect', () => console.log('已连接'));
    socket.on('disconnect', () => {
        if (!loginSection.classList.contains('hidden')) {
            errorMsg.textContent = '服务器连接已断开';
        }
    });

    // ========== 事件绑定 ==========
    loginForm.addEventListener('submit', function(e) { e.preventDefault(); login(); });

    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    fileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0 || !currentChat) return;
        files.forEach(file => {
            if (file.size > 100 * 1024 * 1024) { alert(`文件 ${file.name} 超过100MB`); return; }
            uploadFile(file);
        });
        fileInput.value = '';
    });

    // ========== 自动登录 ==========
    document.addEventListener('DOMContentLoaded', function() {
        const urlUser = new URLSearchParams(window.location.search).get('user');
        const sessionUser = sessionStorage.getItem('coderChatUsername') || sessionStorage.getItem('user');
        if (urlUser) sendLoginMsgApi(urlUser);
        else if (sessionUser) sendLoginMsgApi(sessionUser);
    });

    // ========== Exports ==========
    window.sendMessage = sendMessage;
    window.sendFile = sendFile;
    window.dialog = dialog;
    window.clearChat = function() { if (currentChat) messagesDiv.innerHTML = ''; };
    window.uploadFile = uploadFile;
    window.openRequestDialog = openRequestDialog;
    window.handleFriendRequest = handleFriendRequest;
    window.cancelFriendRequest = cancelFriendRequest;
    window.startDirectChat = startDirectChat;
    window.logout = logout;

    console.log('移动端聊天已加载，服务器:', SERVER_CONFIG.http);
</script>
</body>
</html>
