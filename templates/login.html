success"===e.status?t(!0,e.user_id,e.isT,e.error_hint):(clearAutoLogin(),t(!1,null))}).catch(e=>{console.error("自动登录错误:",e),t(!1)})}function loadAutoLoginSetting(){try{const e=localStorage.getItem(AUTO_LOGIN_KEY);if(e){const o=JSON.parse(e);document.querySelector("#autoLogin").checked=o.enabled||!1}}catch(e){console.error("加载自动登录设置失败:",e)}}function saveAutoLoginConfig(e,o){try{if(document.querySelector("#autoLogin").checked){const t={enabled:!0,username:e,password:o,saveTime:(new Date).getTime(),expireTime:(new Date).getTime()+2592e6};localStorage.setItem(AUTO_LOGIN_KEY,JSON.stringify(t)),localStorage.setItem(USER_DATA_KEY,JSON.stringify({username:e,isTeacher:"111111"===o}))}else clearAutoLogin()}catch(e){console.error("保存自动登录配置失败:",e)}}function clearAutoLogin(){try{localStorage.removeItem(AUTO_LOGIN_KEY),document.querySelector("#autoLogin").checked=!1}catch(e){console.error("清除自动登录配置失败:",e)}}function handleAutoLoginSuccess(e,o,t,n,s){sessionStorage.setItem("user",e),sessionStorage.setItem("isTeacher",n.toString()),sessionStorage.setItem("userID",t),s&&alert(s);let r=document.referrer;(!r||r.includes(window.location.href)||r.includes("/outdatedLogin"))&&(r="/"),setTimeout(()=>{try{if("/"!==r){const e=new URL(r).toString();console.log("自动登录跳转到:",e),window.location.href=e}else window.location.href="/"}catch(e){console.error("跳转失败:",e),document.querySelector("#autoLoginLoading").style.display="none",document.querySelector("#loginFormContainer").style.display="block",showMessage("自动登录跳转失败","error")}},500)}function showMessage(e,o){const t=document.querySelector("#message");t.style.display="block",t.textContent=e,t.className="error"===o?"error-message":"success-message"}function sendMessage(e,o){const t={user:e,pwd:o};fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)}).then(e=>e.json()).then(t=>{console.log(t),"success"===t.status?(saveAutoLoginConfig(e,o),handleLoginSuccess(e,o,t.user_id,t.isT,t.isActive,t.error_hint)):
