<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>翱三通史-登录</title>
	<link rel="icon" href="" type="image/x-icon"/>
	<link rel="stylesheet" href="./../static/css/verify.css">
</head>
<body>
<div class="login-container">
	<h2>用户登录</h2>

	<!-- 自动登录加载提示 -->
	<div id="autoLoginLoading" class="loading" style="display: none;">
		<div class="spinner"></div>
		<span>正在自动登录...</span>
	</div>

	<div class="policy">
		<dialog class="user-policy" id="policy-area">
			<div id="policy"></div>
			<button class="close-dialog" disabled>
				<span id="disabled-hint"><span id="disabled-time">5</span>s后可以点击&nbsp;&nbsp;</span>
				我已知晓《翱三通史官网用户信息保密协议》
			</button>
		</dialog>
	</div>

	<div class="allow-policy">
		<dialog id="allow">
			<div>登录即代表用户知晓并同意<span class="show-policy">《翱三通史官网用户信息保密协议》</span></div>
			<button id="continue" class="login-btn" disabled>登录</button>
		</dialog>
	</div>

	<div id="loginFormContainer">
		<form id="loginForm">
			<div class="form-group">
				<input type="text" id="username" placeholder="用户名(请填写真实姓名)" required>
			</div>
			<div class="form-group">
				<input type="password" id="password" placeholder="密码(请输入学号,如果您是老师,请输入111111)" required>
			</div>

			<!-- ✅ 记住我选项 -->
			<div class="check-area">
				<input type="checkbox" id="rememberMe">
				<label for="rememberMe">记住我（30天内自动登录）</label>
			</div>

			<div class="check-area">
				<input type="checkbox" id="know-policy">
				<label for="know-policy">已知晓</label><span id="show-p" class="show-policy">《翱三通史官网用户信息保密协议》</span>
			</div>

			<button type="submit" class="login-btn">登录</button>
			<div id="message" class="error-message"></div>
			<div class="info-text">
				请注意：用户名为真实姓名，密码为学号。如果您是老师，请输入：真实姓名+111111；
				如果您是本班的非中考学科教师或非本班教师，请输入：test+111111；
				<strong>不支持家长登录！</strong>
			</div>
			<a href="/outdatedLogin" class="a-link">使用怀旧版</a>
			<a href="/issues" class="a-link">无法登录？向翱三通史安全应急响应中心反映问题</a>
		</form>
	</div>
</div>

<script>
	// ========== 配置常量 ==========
	const REMEMBER_TOKEN_KEY = 'Orsun_Remember_Token';

	// ========== 页面初始化 ==========
	window.addEventListener('DOMContentLoaded', function() {
		const showPolicyButtons = document.querySelectorAll('.show-policy');
		showPolicyButtons.forEach(btn => btn.addEventListener('click', () => showUserPolicy()));

		const continueBtn = document.querySelector('#continue');
		continueBtn.addEventListener('click', () => {
			document.querySelector('#allow').close();
			document.querySelector('#loginForm').dispatchEvent(new Event('submit'));
		});

		document.querySelector('.close-dialog').onclick = closeDialog;
		document.querySelector('#message').style.display = 'none';

		// ✅ 检查"记住我"自动登录
		checkRememberMe();
	});

	// ========== 检查"记住我"自动登录 ==========
	async function checkRememberMe() {
		try {
			const token = localStorage.getItem(REMEMBER_TOKEN_KEY);
			if (!token) return;

			// 显示加载状态
			document.querySelector('#autoLoginLoading').style.display = 'flex';
			document.querySelector('#loginFormContainer').style.display = 'none';

			const response = await fetch("/api/auto-login", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
				},
				body: JSON.stringify({ token: token }),
				credentials: "include"
			});

			const data = await response.json();

			if (data.status === "success") {
				// ✅ 自动登录成功，跳转到首页
				console.log("自动登录成功:", data.data.username);
				window.location.href = "/";
			} else {
				// ✅ 令牌无效，清除并显示登录表单
				console.log("自动登录失败:", data.msg);
				localStorage.removeItem(REMEMBER_TOKEN_KEY);
				document.querySelector('#autoLoginLoading').style.display = 'none';
				document.querySelector('#loginFormContainer').style.display = 'block';
				showMessage('自动登录已过期，请手动登录', 'error');
			}
		} catch (e) {
			console.error('检查"记住我"失败:', e);
			document.querySelector('#autoLoginLoading').style.display = 'none';
			document.querySelector('#loginFormContainer').style.display = 'block';
		}
	}

	// ========== 显示用户协议 ==========
	async function showUserPolicy() {
		const policyArea = document.querySelector('#policy-area');
		const policyDiv = document.querySelector("#policy");
		if (!policyDiv.shadowRoot) {
			const res = await fetch("/userPolicy", { method: 'GET', credentials: 'same-origin' });
			policyDiv.attachShadow({mode: 'open'});
			policyDiv.shadowRoot.innerHTML = await res.text();
		}
		policyArea.showModal();
		const hint = document.querySelector('#disabled-hint');
		const timeoutSpan = document.querySelector('#disabled-time');
		const sureBtn = document.querySelector('.close-dialog');
		const timeLoop = setInterval(() => {
			let time = parseInt(timeoutSpan.innerText);
			if (time > 0) {
				time--;
				timeoutSpan.innerText = time.toString();
			} else {
				clearInterval(timeLoop);
				hint.style.display = 'none';
				sureBtn.disabled = false;
				document.querySelector("#continue").disabled = false;
			}
		}, 1000)
	}

	function closeDialog() {
		document.querySelector("#policy-area").close();
		document.querySelector('#know-policy').checked = true;
	}

	// ========== 登录表单提交 ==========
	document.querySelector('#loginForm').addEventListener('submit', function(e) {
		e.preventDefault();

		const username = document.querySelector('#username').value.trim();
		const password = document.querySelector('#password').value.trim();
		const knowPolicyInput = document.querySelector('#know-policy');
		const rememberMe = document.querySelector('#rememberMe').checked;  // ✅ 获取"记住我"状态
		const messageElement = document.querySelector('#message');

		// 重置消息提示
		messageElement.textContent = '';
		messageElement.className = 'error-message';

		// 基础验证
		if (!username || !password) {
			showMessage('用户名和密码不能为空', 'error');
			return;
		}

		if (!knowPolicyInput.checked) {
			const allowDialog = document.querySelector('#allow');
			allowDialog.showModal();
			return;
		}

		// 显示登录中状态
		showMessage('登录中...', 'success');

		// 发送登录请求
		sendLoginRequest(username, password, rememberMe);
	});

	// ========== 发送登录请求 ==========
	function sendLoginRequest(username, password, rememberMe) {
		const data = {
			user: username,
			pwd: password,
			remember_me: rememberMe  // ✅ 传递"记住我"选项
		};

		fetch("/api/login", {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
			},
			body: JSON.stringify(data),
			credentials: "include"
		})
				.then((res) => res.json())
				.then((data) => {
					console.log("登录响应:", data);
					if (data.status === "success") {
						// ✅ 保存"记住我"令牌
						if (data.remember_token) {
							localStorage.setItem(REMEMBER_TOKEN_KEY, data.remember_token);
							console.log("✅ 已保存“记住我”令牌");
						}

						// ✅ 处理登录成功（不再存储 user_id 到 sessionStorage）
						handleLoginSuccess(username, data.isActive, data.error_hint);
					} else {
						showMessage(data.msg, "error");
					}
				})
				.catch((err) => {
					console.error("登录错误:", err);
					showMessage("网络错误，请稍后再试", 'error');
				});
	}

	// ========== 处理登录成功 ==========
	function handleLoginSuccess(username, isActive, errorHint) {
		showMessage('登录成功，正在跳转...', 'success');

		if (errorHint) alert(errorHint);

		if (!isActive) {
			showMessage("用户账号还未激活，正在跳转激活页……", "error");
			setTimeout(() => {
				window.location.href = "/face/";
			}, 1000);
			return;
		}

		// ✅ 获取跳转页面
		let jumpPage = document.referrer;
		if (!jumpPage || jumpPage.includes(window.location.href) || jumpPage.includes('/outdatedLogin')) {
			jumpPage = "/";
		}

		// 延迟跳转
		setTimeout(() => {
			try {
				if (jumpPage !== "/") {
					const redirectUrl = new URL(jumpPage).toString();
					console.log("跳转到:", redirectUrl);
					window.location.href = redirectUrl;
				} else {
					window.location.href = "/";
				}
			} catch (err) {
				console.error('跳转失败:', err);
				showMessage('跳转失败，请手动访问目标页面', 'error');
			}
		}, 500);
	}

	// ========== 显示消息 ==========
	function showMessage(message, type) {
		const messageElement = document.querySelector('#message');
		messageElement.style.display = 'block';
		messageElement.textContent = message;
		messageElement.className = type === 'error' ? 'error-message' : 'success-message';
	}
</script>
</body>
</html>
