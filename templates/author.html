<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>翱三通史 · 作者编辑</title><link rel="stylesheet" href="./../static/css/common.css"><style>#container{background:#f7efe0 linear-gradient(145deg,#f3ead9 0,#faf3e2 70%);border:1px solid #bbaa8a;border-radius:32px 32px 24px 24px;box-shadow:0 20px 30px -10px rgba(0,0,0,.7),inset 0 0 0 1px #fff6e5,inset 2px 2px 8px rgba(255,245,215,.8);padding:2.5rem 3rem;max-width:800px;width:100%;margin:2rem 0;position:relative;transition:box-shadow .3s ease}#container::before{content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;border:1px solid rgba(140,110,70,.2);border-radius:36px 36px 28px 28px;pointer-events:none;box-shadow:inset 0 0 20px #bba27a40}h3{font-size:2.4rem;font-weight:400;letter-spacing:6px;color:#3c2e1f;text-shadow:1px 1px 0 #fff3e0,2px 2px 0 #c9b697;border-bottom:2px solid #b99e7c;padding-bottom:.7rem;margin-bottom:2rem;font-family:'Times New Roman','宋体',serif;text-align:center;position:relative}h3::after{content:'⸻  ✻  ⸻';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);color:#8f7b5f;font-size:1rem;letter-spacing:4px;background:#f7efe0;padding:0 1rem;white-space:nowrap}.type{font-family:"微软雅黑","Segoe UI",sans-serif;font-size:1.4rem}.psg{font-family:Georgia,'Times New Roman','宋体',serif;color:#3c2e1f;min-height:200px;padding:1rem .5rem}.psg p{font-size:1.3rem;color:#6b5a45;font-style:italic;letter-spacing:1px;text-align:center;padding:3rem 1rem;background:rgba(220,200,170,.2);border-radius:48px;border:1px dashed #bba27a;box-shadow:inset 0 0 12px #e2d3ba}.psg ul{list-style:none;padding:0;margin:0;border-top:1px solid #dac292;border-bottom:1px solid #dac292;background:#fdf7ec;box-shadow:inset 0 0 0 1px #fff9ed,inset 0 0 12px #e7d7bd;border-radius:20px;overflow:hidden}.psg li{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2rem;border-bottom:1px dashed #d6bd9a;font-size:1.3rem;transition:background .2s ease}.psg li:last-child{border-bottom:none}.psg li:hover{background:#efe3cf}.psg li span{font-weight:500;color:#2f2419;letter-spacing:1px;position:relative;padding-left:1.2rem}.psg li span::before{content:'❦';position:absolute;left:-8px;top:50%;transform:translateY(-50%);color:#b5956b;font-size:1.2rem;opacity:.7}.psg li a{display:inline-block;font-size:1.2rem;padding:.4rem 1.6rem;background:linear-gradient(145deg,#d2bc9c,#ecdbbc);border:1px solid #b07d4c;border-radius:40px;color:#2e241b;text-decoration:none;box-shadow:0 4px 0 #7a623e,0 6px 10px -4px #3a2e1e,inset 0 1px 3px #fffae9;font-family:Georgia,'Times New Roman',serif;letter-spacing:1px;transition:all .12s ease-in-out;white-space:nowrap}.psg li a::before{content:'✎';margin-right:6px;font-size:1.1rem;opacity:.8}.psg li a:hover{transform:translateY(3px);box-shadow:0 2px 0 #7a623e,0 8px 12px -6px #1f1a0e,inset 0 1px 4px ivory;background:linear-gradient(145deg,#cbb59a,#e6d2b8);color:#1b130b;border-color:#9e6e3f}.psg li a:active{transform:translateY(6px);box-shadow:0 0 0 #7a623e,0 8px 12px -6px #0f0b06}body::before{content:'翱三通史 · 文心雕龙';position:fixed;bottom:12px;right:20px;font-size:.85rem;color:#67553d;background:#efe6d4c0;padding:.3rem 1rem;border-radius:30px;border:1px solid #bba27a;backdrop-filter:blur(2px);box-shadow:0 2px 6px #221e14;font-family:'Courier New','宋体',monospace;letter-spacing:2px;z-index:10}@media (max-width:600px){#container{padding:1.8rem 1.2rem}h3{font-size:2rem;letter-spacing:4px}.psg li{padding:1rem 1.2rem;font-size:1.1rem;flex-wrap:wrap;gap:.8rem}.psg li span{padding-left:1.5rem}.psg li a{font-size:1rem;padding:.3rem 1.2rem}}@media (max-width:420px){.psg li{flex-direction:column;align-items:flex-start}.psg li span::before{left:-5px}.psg li a{align-self:flex-end}}</style><script>function getArticle(e){const t={author:e,type:"article"};fetch("/api/get-articles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)}).then(e=>e.json()).then(e=>{if(console.log(e),!e||!e.data||0===e.data.length){return void(document.querySelector("#psg-li").innerHTML="<p>📜 您尚未撰写任何文章</p>")}showArticle(e.data,"#psg-li")}).catch(e=>{console.log(e),document.querySelector("#psg-li").innerHTML="<p>❌ 载入失败，请稍后重试</p>"})}function getDraftArticle(){fetch("/admin/get-draft").then(e=>e.text()).then(e=>{const t=JSON.parse(e);console.log(t);const n=t.a;if(!n){return void(document.querySelector("#review-li").innerHTML="<p>📜 没有任何文章需要审核</p>")}showArticle(n,"#review-li",!0)})}function showArticle(e,t,n=!1){const r=document.querySelector(t);if(!Array.isArray(e)||0===e.length)return void(r.innerHTML="<p>📭 这里没有文章</p>");let s="<ul>";e.forEach(e=>{s+=`\n                <li>\n                    <span>${escapeHtml(e[0])||"无题"}</span>\n                    <a href="/edit?slug=${encodeURIComponent(e[1])}&r=${n}&type=${n?"student":"article"}">${n?"审核":"编辑"}</a>\n                    <a href="/psg/${encodeURIComponent(e[1])}">预览</a>\n                </li>\n                `}),s+="</ul>",r.innerHTML=s;document.querySelectorAll("a").forEach(e=>{e.addEventListener("click",t=>{t.preventDefault();window.open(e.href).postMessage({type:"AUTH_STATE",isLoggedIn:!0,user:sessionStorage.getItem("user"),isTeacher:"true"===sessionStorage.getItem("isTeacher"),userId:sessionStorage.getItem("userID")},"https://www.cjchcoderchat.site:3")})})}function escapeHtml(e){return e?e.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"):e}window.addEventListener("message",e=>{"https://www.cjchcoderchat.site:3"===e.origin&&e.data&&"AUTH_STATE"===e.data.type&&e.data.isLoggedIn&&(sessionStorage.setItem("user",e.data.user),sessionStorage.setItem("isTeacher",e.data.isTeacher.toString()),sessionStorage.setItem("userID",e.data.userId))})</script><script src="./../static/js/checkAdmin.js" type="module"></script></head><body><div id="container"><h3>作者编辑</h3><div class="type"><strong>· 可编辑 ·</strong></div><div id="psg-li" class="psg"><p>📖 加载中……</p></div><div class="type"><strong>· 待审核 ·</strong></div><div id="review-li" class="psg"><p>📖 加载中……</p></div><a href="/edit" class="signature-container signature-link">✻ 新建文章 ✻</a> <button class="signature-container signature-btn" onclick="logout()">✻ 退出登录 ✻</button></div><script type="module">import{isAdmin}from"../static/js/checkAdmin.js";const user=sessionStorage.getItem("user"),userId=sessionStorage.getItem("userID"),isTeacher=sessionStorage.getItem("isTeacher");user||(window.location.href="/login"),isAdmin(userId).then(e=>{console.log(e),e?(getArticle(".*"),getDraftArticle()):(document.querySelector("#review-li").style.display="none",getArticle(user))})</script></body></html>
