<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翱三通史 · 备案维护</title>
    <!-- 柔和、干净的风格，符合正式通知氛围 -->
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f9fe;  /* 极浅蓝灰，宁静专业 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        /* 卡片容器 — 提升精致感 */
        .notice-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 3rem 2.8rem;
            box-shadow:
                    0 20px 40px -12px rgba(0, 20, 40, 0.25),
                    0 8px 24px -8px rgba(0, 32, 64, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            text-align: center;
        }

        /* 装饰性徽标 / 图标 (纯CSS) */
        .notice-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 1.8rem;
        }
        .notice-icon span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #eef4ff, #dce6f5);
            border-radius: 50%;
            font-size: 2.4rem;
            color: #1e3c72;
            box-shadow: 0 6px 14px rgba(26, 67, 113, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 主标题 (品牌名) */
        .brand-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #1a2f4f;
            margin-bottom: 0.25rem;
        }
        .brand-title small {
            font-weight: 400;
            font-size: 1rem;
            color: #5a6f8c;
            letter-spacing: 0.3px;
            margin-left: 6px;
        }

        /* 分割装饰 */
        .divider {
            width: 64px;
            height: 3px;
            background: linear-gradient(90deg, #b6cae3, #8aa2c7);
            margin: 1.2rem auto 1.8rem auto;
            border-radius: 12px;
            opacity: 0.6;
        }

        /* 核心提示文字 — 润色后更正式、清晰 */
        .notice-text {
            font-size: 1.3rem;
            line-height: 1.7;
            color: #1d334f;
            font-weight: 450;
            letter-spacing: 0.02em;
        }
        .notice-text strong {
            font-weight: 600;
            color: #0a2647;
        }
        .notice-text .highlight {
            display: inline-block;
            background: linear-gradient(120deg, rgba(32, 78, 138, 0.06), rgba(32, 78, 138, 0.12));
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            font-weight: 500;
            color: #134078;
            border: 1px solid rgba(32, 78, 138, 0.08);
        }

        /* 时间标签 — 更柔和的辅助信息 */
        .time-badge {
            margin-top: 2rem;
            display: inline-block;
            background: #e9eff8;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            font-size: 1rem;
            color: #2b4b74;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.6);
            backdrop-filter: blur(2px);
        }
        .time-badge i {
            font-style: normal;
            display: inline-block;
            margin-right: 6px;
        }

        /* 小字脚注 — 保持友好 */
        .footnote {
            margin-top: 2.2rem;
            font-size: 0.9rem;
            color: #657b9b;
            letter-spacing: 0.2px;
            border-top: 1px dashed rgba(96, 120, 160, 0.2);
            padding-top: 1.8rem;
            opacity: 0.8;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .notice-card {
                padding: 2.2rem 1.5rem;
                border-radius: 28px;
            }
            .notice-text {
                font-size: 1.1rem;
                line-height: 1.6;
            }
            .brand-title {
                font-size: 1.5rem;
            }
            .notice-icon span {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
            .time-badge {
                padding: 0.4rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="notice-card">
    <!-- 装饰图标：取自“书卷/历史”意象，契合“翱三通史” -->
    <div class="notice-icon">
        <span>📜</span>
    </div>

    <!-- 品牌名称 + 微标识 -->
    <div class="brand-title">
        翱三通史
        <small>· 典藏</small>
    </div>

    <div class="divider"></div>

    <!-- 润色后的提示文字：更书面、正式，同时保留温度 -->
    <div class="notice-text">
        <strong>网站例行维护</strong> · 依据 <span class="highlight">IPC 备案</span> 要求
        <br>
        本站即日起暂停访问，预计 <strong>20–40 天</strong> 后恢复开放。
    </div>

    <!-- 时间/状态徽章 (强化可信度) -->
    <div class="time-badge">
        <i>🕊️</i> 备案周期 · 2026 年 8 月
        <i>📅</i> 提交时间 · 2026 年 8 月 4 日
    </div>

    <!-- 友好脚注，增加人文感 -->
    <div class="footnote">
        感谢您的理解与等待 · 我们稍后重逢
    </div>

    <div>
        <a href="/chat?@=admin">对此网页有疑问？联系管理员</a><br>
        <a href="/version">常见问题解答</a>
    </div>
</div>
</body>
</html>
