<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翱三通史 - 错误汇总</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f6f4f0;min-height:100vh;padding:40px 20px;display:flex;justify-content:center;align-items:flex-start}.container{max-width:1200px;width:100%;background:#fff;border-radius:28px;border:1px solid #edeae5;box-shadow:0 8px 24px rgba(0,0,0,.02),0 2px 6px rgba(0,0,0,.01);padding:2.8rem 2.5rem 2.2rem;transition:box-shadow .2s ease}.container:hover{box-shadow:0 12px 32px rgba(0,0,0,.02),0 4px 12px rgba(0,0,0,.01);border-color:#e3dbd2}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #e6e0d8}.header h1{font-size:26px;font-weight:600;color:#2b241e;display:flex;align-items:center;gap:10px}.header h1 .icon{font-size:28px}.header .badge{background:#f0ece6;color:#2b241e;padding:6px 16px;border-radius:30px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;border:1px solid #edeae5}.header .badge .count{background:#c6b9ab;color:#fff;border-radius:50%;padding:0 8px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}.stats{display:flex;gap:15px;margin-bottom:28px;flex-wrap:wrap}.stat-card{background:#faf9f7;padding:10px 20px;border-radius:12px;border:1px solid #edeae5;font-size:14px;color:#4a4a4a}.stat-card .number{font-weight:700;font-size:18px;color:#2b241e}#show-issues{list-style:none;display:flex;flex-direction:column;gap:12px}#show-issues li{background:#faf9f7;border:1px solid #edeae5;border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;transition:all .2s ease;flex-wrap:wrap}#show-issues li:hover{border-color:#d6cbc0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.02);transform:translateX(4px)}.issue-content{display:flex;align-items:center;gap:16px;flex:1;min-width:200px;flex-wrap:wrap}.issue-id{background:#f0ece6;color:#2b241e;padding:2px 12px;border-radius:20px;font-size:12px;font-weight:600;font-family:'Courier New',monospace}.issue-field{display:flex;align-items:center;gap:6px;color:#2b241e;font-size:15px}.issue-field .label{color:#a39484;font-size:13px}.issue-field .value{font-weight:500;background:#fefcbf;padding:2px 10px;border-radius:6px;color:#744210;word-break:break-all}.issue-field .value.error-msg{background:#fde8e8;color:#9b2c2c;max-width:300px}.issue-time{font-size:13px;color:#a39484;white-space:nowrap;display:flex;align-items:center;gap:4px}.resolve{background:#2b241e;color:#fff;border:none;padding:8px 24px;border-radius:40px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s ease;white-space:nowrap;display:flex;align-items:center;gap:6px}.resolve:hover{background:#1f1b17;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}.resolve:active{transform:translateY(0)}.resolve:disabled{opacity:.5;cursor:not-allowed;transform:none}.empty-state{text-align:center;padding:60px 20px;color:#a39484}.empty-state .empty-icon{font-size:56px;margin-bottom:12px}.empty-state p{font-size:18px}.toast{position:fixed;top:30px;right:30px;background:#2b241e;color:#fff;padding:14px 28px;border-radius:60px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.1);transform:translateX(120%);transition:transform .4s ease;z-index:1000}.toast.show{transform:translateX(0)}.toast.error{background:#b91c1c}.loading{text-align:center;padding:40px;color:#a39484}.loading .spinner{width:40px;height:40px;margin:0 auto 16px;border:4px solid #edeae5;border-top:4px solid #2b241e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (max-width:768px){.container{padding:20px}.header{flex-direction:column;align-items:flex-start;gap:12px}.header h1{font-size:22px}#show-issues li{flex-direction:column;align-items:stretch;gap:12px}.issue-content{flex-direction:column;align-items:flex-start;gap:8px}.issue-time{align-self:flex-start}.resolve{width:100%;justify-content:center}.stats{flex-direction:column}}</style></head><body><div class="container"><div class="header"><h1><span class="icon">📋</span> 错误汇总</h1><div class="badge">🚨 未处理 <span class="count" id="errorCount">0</span></div></div><div class="stats"><div class="stat-card">📊 总错误数：<span class="number" id="totalCount">0</span></div><div class="stat-card">⏳ 待处理：<span class="number" id="pendingCount">0</span></div></div><ul id="show-issues"></ul></div><div id="toast" class="toast"><span>✅</span> <span id="toastMessage">操作成功！</span></div><script>let errorList=[];async function getError(){const e=document.getElementById("show-issues");e.innerHTML='\n                <div class="loading">\n                    <div class="spinner"></div>\n                    <p>加载错误信息中...</p>\n                </div>\n            ';try{const t=await fetch("/admin/get-issues"),s=await t.text(),n=JSON.parse(s);"success"===n.status&&n.data&&n.data.length>0?(errorList=n.data,renderIssues(errorList),updateStats(errorList)):(e.innerHTML='\n                        <div class="empty-state">\n                            <div class="empty-icon">🎉</div>\n                            <p>太棒了！没有发现任何错误</p>\n                        </div>\n                    ',updateStats([]))}catch(t){console.error(t),e.innerHTML='\n                    <div class="empty-state">\n                        <div class="empty-icon">⚠️</div>\n                        <p>加载失败，请刷新重试</p>\n                    </div>\n                '}}function renderIssues(e){const t=document.querySelector("#show-issues");t.innerHTML="",e.forEach((e,s)=>{const n=document.createElement("li"),o=e[0]||`ERR-${String(s+1).padStart(4,"0")}`,a=e[1]||"未知错误",i=e[2]||(new Date).toLocaleString("zh-CN");n.innerHTML=`\n                    <div class="issue-content">\n                        <span class="issue-id">#${o}</span>\n                        <span class="issue-field">\n                            <span class="label">错误信息：</span>\n                            <span class="value error-msg">${escapeHtml(a)}</span>\n                        </span>\n                        <span class="issue-time">🕐 ${i}</span>\n                    </div>\n                    <button class="resolve" data-issue-id="${o}">\n                        ✅ 标记已解决\n                    </button>\n                `,t.appendChild(n)}),document.querySelectorAll(".resolve").forEach(e=>{e.addEventListener("click",handleResolve)})}function escapeHtml(e){const t=document.createElement("div");return t.textContent=e,t.innerHTML}function updateStats(e){const t=e?e.length:0;document.getElementById("totalCount").textContent=t,document.getElementById("pendingCount").textContent=t,document.getElementById("errorCount").textContent=t}async function handleResolve(e){const t=e.currentTarget,s=t.dataset.issueId,n=t.innerHTML;t.disabled=!0,t.innerHTML="⏳ 处理中...";try{const e=await fetch("/admin/resolve-issues",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({error_id:s})}),o=await e.json();if("success"===o.status){showToast("✅ 错误已成功解决！",!1);const e=t.closest("li");e.style.transition="all 0.3s ease",e.style.opacity="0",e.style.transform="translateX(30px)",setTimeout(()=>{e.remove();const t=document.querySelectorAll("#show-issues li").length;updateStats(Array(t).fill(null)),0===t&&(document.querySelector("#show-issues").innerHTML='\n                                <div class="empty-state">\n                                    <div class="empty-icon">🎉</div>\n                                    <p>所有错误已处理完毕！</p>\n                                </div>\n                            ')},300),console.log("数据已同步到后台！")}else showToast("❌ 操作失败："+(o.message||"未知错误"),!0),t.disabled=!1,t.innerHTML=n}catch(e){console.error(e),showToast("❌ 网络错误，请重试",!0),t.disabled=!1,t.innerHTML=n}}function showToast(e,t=!1){const s=document.getElementById("toast"),n=document.getElementById("toastMessage");s.className="toast"+(t?" error":""),n.textContent=e,s.classList.add("show"),clearTimeout(s._timeout),s._timeout=setTimeout(()=>{s.classList.remove("show")},3e3)}function init(){getError()}document.addEventListener("DOMContentLoaded",init)</script></body></html>
