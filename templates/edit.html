ue="draft"):alert("未找到文章")}).catch(e=>console.error(e))},editForm.addEventListener("submit",e=>{e.preventDefault();const t={title:titleEl.value,content:contentEl.value,slug:slugEl.value,author:authorEl.value,status:statusSelect.value};"article"===currentType&&(t.saying=sayingEl.value);fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:user,article:t,pwd:passwordEl.value,request:isChanged?"change":"upload",type:currentType,isReview:isReview})}).then(e=>e.json()).then(e=>{console.log(e);const t=document.querySelector("#msg");"success"===e.status?(t.innerHTML="<span class='success'>提交成功！</span>",setTimeout(()=>{window.location.href="article"===currentType?`/psg/${slugEl.value}`:`/student/${slugEl.value}`},1e3)):t.innerHTML=`<span class='fail'>提交失败：${e.msg}</span>`}).catch(e=>{console.error(e),document.querySelector("#msg").innerHTML="<span class='fail'>网络错误，请稍后重试</span>"})});const urlParams=new URLSearchParams(window.location.search);let slug=urlParams.get("slug");const typeParam=urlParams.get("type"),isReview="true"===urlParams.get("r");isReview&&(document.querySelector("button[type='submit']").innerText="提交审核",document.querySelector("option[value='draft']").innerText="📄 驳回文章",document.querySelector("option[value='published']").innerText="🌐 允许发布",contentEl.disabled=!0,sayingEl.disabled=!0),"student"===typeParam&&setArticleType("student"),slug&&(searchEL.value=slug,window.search())</script></div></body></html>
